<script>
const BLUE = "#1976d2";
const RED = "#d32f2f";
const ORANGE = "#ef6c00";
const PURPLE = "#7b1fa2";
const GREEN = "#388e3c";
const BLACK = "#111111";
const GRAY = "#616161";

const chart = document.getElementById("chart");

let currentStock = null;
let currentTopix = null;
let topixPromise = null;

let currentSupply = null;
let currentSupplyDaily = [];

let currentCode = "9984";
let currentRangeStart = null;
let currentRangeEnd = null;

let updatingRange = false;
let showVolumePane = false;

// Trace indexes.
// Profile indexes must stay stable because restyle() uses them.
const PROFILE_UP_INDEX = 8;
const PROFILE_DOWN_INDEX = 9;

function isFiniteNumber(v) {
  return typeof v === "number" && Number.isFinite(v);
}

function toNumber(v) {
  if (v === null || v === undefined || v === "") {
    return null;
  }

  const n = Number(v);

  return Number.isFinite(n)
    ? n
    : null;
}

function formatNumber(v, digits = 0) {
  const n = toNumber(v);

  return n === null
    ? "-"
    : n.toLocaleString(
        "ja-JP",
        {
          maximumFractionDigits: digits
        }
      );
}

function parseDate(text) {
  return new Date(
    `${text}T00:00:00`
  );
}

function dateString(date) {
  return (
    `${date.getFullYear()}-` +
    `${String(date.getMonth()+1).padStart(2,"0")}-` +
    `${String(date.getDate()).padStart(2,"0")}`
  );
}

function percentileInc(values, p) {
  if (
    !values.length ||
    !values.every(isFiniteNumber)
  ) {
    return null;
  }

  const sorted =
    [...values].sort(
      (a,b) => a-b
    );

  if (sorted.length === 1) {
    return sorted[0];
  }

  const rank =
    p *
    (sorted.length - 1);

  const lower =
    Math.floor(rank);

  const upper =
    Math.ceil(rank);

  if (lower === upper) {
    return sorted[lower];
  }

  const w =
    rank - lower;

  return (
    sorted[lower] * (1-w) +
    sorted[upper] * w
  );
}

function calculateSma(rows, key, period) {
  const result =
    new Array(rows.length).fill(null);

  for (
    let i = period - 1;
    i < rows.length;
    i++
  ) {
    const values =
      rows
        .slice(
          i-period+1,
          i+1
        )
        .map(
          r => r[key]
        );

    if (
      values.every(isFiniteNumber)
    ) {
      result[i] =
        values.reduce(
          (a,b) => a+b,
          0
        ) /
        period;
    }
  }

  return result;
}

function calculateSmaValues(
  values,
  period
) {
  const result =
    new Array(
      values.length
    ).fill(null);

  let sum = 0;
  let validCount = 0;

  for (
    let i = 0;
    i < values.length;
    i++
  ) {
    const value =
      values[i];

    if (
      isFiniteNumber(value)
    ) {
      sum += value;
      validCount++;
    }

    if (
      i >= period
    ) {
      const old =
        values[i-period];

      if (
        isFiniteNumber(old)
      ) {
        sum -= old;
        validCount--;
      }
    }

    if (
      i >= period-1 &&
      validCount === period
    ) {
      result[i] =
        sum /
        period;
    }
  }

  return result;
}

function calculateRci(
  rows,
  period
) {
  const result =
    new Array(
      rows.length
    ).fill(null);

  for (
    let i = period-1;
    i < rows.length;
    i++
  ) {
    const prices =
      rows
        .slice(
          i-period+1,
          i+1
        )
        .map(
          r => r.close
        );

    if (
      !prices.every(
        isFiniteNumber
      )
    ) {
      continue;
    }

    const sorted =
      prices
        .map(
          (value,index) => ({
            value,
            index
          })
        )
        .sort(
          (a,b) =>
            a.value -
            b.value
        );

    const priceRanks =
      new Array(period);

    for (
      let p = 0;
      p < period;
    ) {
      let q =
        p + 1;

      while (
        q < period &&
        sorted[q].value ===
        sorted[p].value
      ) {
        q++;
      }

      const averageRank =
        (
          (p+1) +
          q
        ) /
        2;

      for (
        let k = p;
        k < q;
        k++
      ) {
        priceRanks[
          sorted[k].index
        ] =
          averageRank;
      }

      p = q;
    }

    let sumD2 = 0;

    for (
      let j = 0;
      j < period;
      j++
    ) {
      const timeRank =
        j + 1;

      const d =
        timeRank -
        priceRanks[j];

      sumD2 +=
        d*d;
    }

    result[i] =
      (
        1 -
        (
          6*sumD2
        ) /
        (
          period *
          (
            period*period -
            1
          )
        )
      ) *
      100;
  }

  return result;
}

function calculateRollingZ(
  values,
  period = 252,
  minValid = 60
) {
  const result =
    new Array(
      values.length
    ).fill(null);

  for (
    let i = 0;
    i < values.length;
    i++
  ) {
    const start =
      Math.max(
        0,
        i-period+1
      );

    const window =
      values
        .slice(
          start,
          i+1
        )
        .filter(
          isFiniteNumber
        );

    if (
      window.length <
      Math.min(
        minValid,
        period
      )
    ) {
      continue;
    }

    const mean =
      window.reduce(
        (sum,value) =>
          sum + value,
        0
      ) /
      window.length;

    const variance =
      window.reduce(
        (
          sum,
          value
        ) =>
          sum +
          (
            value -
            mean
          ) *
          (
            value -
            mean
          ),
        0
      ) /
      window.length;

    const sd =
      Math.sqrt(
        variance
      );

    if (
      !(sd > 0) ||
      !isFiniteNumber(
        values[i]
      )
    ) {
      continue;
    }

    result[i] =
      (
        values[i] -
        mean
      ) /
      sd;
  }

  return result;
}

function smoothZ(z) {
  return isFiniteNumber(z)
    ? Math.tanh(
        z/2
      )
    : null;
}

function calculateAtr(
  rows,
  period
) {
  const tr =
    new Array(
      rows.length
    ).fill(null);

  for (
    let i = 0;
    i < rows.length;
    i++
  ) {
    if (
      !isFiniteNumber(
        rows[i].high
      ) ||
      !isFiniteNumber(
        rows[i].low
      )
    ) {
      continue;
    }

    if (
      i === 0 ||
      !isFiniteNumber(
        rows[i-1].close
      )
    ) {
      tr[i] =
        rows[i].high -
        rows[i].low;

      continue;
    }

    tr[i] =
      Math.max(
        rows[i].high -
        rows[i].low,

        Math.abs(
          rows[i].high -
          rows[i-1].close
        ),

        Math.abs(
          rows[i].low -
          rows[i-1].close
        )
      );
  }

  return calculateSmaValues(
    tr,
    period
  );
}

function prepareIndicators(
  rows,
  topixRows = []
) {
  /*
   * ==========================================================
   * 既存VCP系
   * ==========================================================
   */

  for (
    let i = 0;
    i < rows.length;
    i++
  ) {

    /*
     * 表示用52週高値。
     * 当日を含む。
     */
    if (
      i >= 251
    ) {
      let maxHigh =
        -Infinity;

      for (
        let j = i-251;
        j <= i;
        j++
      ) {
        maxHigh =
          Math.max(
            maxHigh,
            rows[j].high
          );
      }

      rows[i].high52 =
        maxHigh;

    } else {

      rows[i].high52 =
        null;
    }


    /*
     * シグナル計算用52週高値。
     *
     * 当日を含めない。
     * ブレイク日に高値距離が
     * 強制的に0になることを避ける。
     */
    if (
      i >= 252
    ) {
      let maxHighPrev =
        -Infinity;

      for (
        let j = i-252;
        j <= i-1;
        j++
      ) {
        maxHighPrev =
          Math.max(
            maxHighPrev,
            rows[j].high
          );
      }

      rows[i].high52Prev =
        maxHighPrev;

    } else {

      rows[i].high52Prev =
        null;
    }


    /*
     * BUY判定用
     * 直前20営業日の高値。
     */
    if (
      i >= 20
    ) {
      let maxHigh20Prev =
        -Infinity;

      for (
        let j = i-20;
        j <= i-1;
        j++
      ) {
        maxHigh20Prev =
          Math.max(
            maxHigh20Prev,
            rows[j].high
          );
      }

      rows[i].high20Prev =
        maxHigh20Prev;

    } else {

      rows[i].high20Prev =
        null;
    }


    /*
     * 既存VCP delta
     */
    if (
      !isFiniteNumber(
        rows[i].vcp26Delta5
      ) &&
      i >= 5 &&
      isFiniteNumber(
        rows[i].vcp26
      ) &&
      isFiniteNumber(
        rows[i-5].vcp26
      )
    ) {
      rows[i].vcp26Delta5 =
        rows[i].vcp26 -
        rows[i-5].vcp26;
    }


    if (
      i >= 119
    ) {
      const values =
        rows
          .slice(
            i-119,
            i+1
          )
          .map(
            r =>
              r.vcp26Delta5
          );

      rows[i].deltaP10 =
        percentileInc(
          values,
          .10
        );

      rows[i].deltaP90 =
        percentileInc(
          values,
          .90
        );

    } else {

      rows[i].deltaP10 =
        null;

      rows[i].deltaP90 =
        null;
    }


    const contraction =
      isFiniteNumber(
        rows[i].dailyVcp
      ) &&
      isFiniteNumber(
        rows[i].dailyVcpP10
      ) &&
      rows[i].dailyVcp <=
      rows[i].dailyVcpP10;


    /*
     * 旧候補は計算だけ残す。
     *
     * 画面上のBUY / SELLには
     * 使用しない。
     */
    rows[i].buyCandidate =
      contraction &&
      isFiniteNumber(
        rows[i].vcp26Delta5
      ) &&
      isFiniteNumber(
        rows[i].deltaP90
      ) &&
      rows[i].vcp26Delta5 >=
      rows[i].deltaP90;


    rows[i].sellCandidate =
      contraction &&
      isFiniteNumber(
        rows[i].vcp26Delta5
      ) &&
      isFiniteNumber(
        rows[i].deltaP10
      ) &&
      rows[i].vcp26Delta5 <=
      rows[i].deltaP10;
  }


  const ma5 =
    calculateSma(
      rows,
      "vcp26",
      5
    );

  const ma25 =
    calculateSma(
      rows,
      "vcp26",
      25
    );


  for (
    let i = 0;
    i < rows.length;
    i++
  ) {
    rows[i].vcp26Ma5 =
      ma5[i];

    rows[i].vcp26Ma25 =
      ma25[i];
  }


  /*
   * ==========================================================
   * Trend / Setup / Trigger
   * ==========================================================
   *
   * Trend
   * =
   * 0.5 * 52週高値Factor
   * +
   * 0.5 * TOPIX相対強度
   *
   *
   * Setup
   * =
   * 0.6 * VCP Factor
   * +
   * 0.4 * RCI Factor
   *
   *
   * Trigger
   * =
   * 0.7 * 出来高Factor
   * +
   * 0.3 * RCI短期加速Factor
   *
   *
   * 各Raw値
   * ↓
   * 252営業日rolling Z-score
   * ↓
   * tanh(z/2)
   * ↓
   * -1 ～ +1
   */


  /*
   * TOPIXは日付をキーにする。
   *
   * 配列番号で合わせない。
   */
  const topixCloseByDate =
    new Map(
      (topixRows || [])
        .filter(
          r =>
            r?.date &&
            isFiniteNumber(
              toNumber(
                r.close
              )
            )
        )
        .map(
          r => [
            r.date,
            toNumber(
              r.close
            )
          ]
        )
    );


  /*
   * ATR
   */
  const atr10 =
    calculateAtr(
      rows,
      10
    );

  const atr50 =
    calculateAtr(
      rows,
      50
    );


  /*
   * 出来高平均
   */
  const volumes =
    rows.map(
      r =>
        toNumber(
          r.volume
        )
    );

  const volMa10 =
    calculateSmaValues(
      volumes,
      10
    );

  const volMa20 =
    calculateSmaValues(
      volumes,
      20
    );

  const volMa50 =
    calculateSmaValues(
      volumes,
      50
    );


  /*
   * RCI
   */
  const rci9 =
    calculateRci(
      rows,
      9
    );

  const rci26 =
    calculateRci(
      rows,
      26
    );


  /*
   * Raw Factor
   */
  const x52 =
    new Array(
      rows.length
    ).fill(null);

  const xVcp =
    new Array(
      rows.length
    ).fill(null);

  const xRci =
    new Array(
      rows.length
    ).fill(null);

  const xRciSlope =
    new Array(
      rows.length
    ).fill(null);

  const xVol =
    new Array(
      rows.length
    ).fill(null);

  const xRs =
    new Array(
      rows.length
    ).fill(null);


  for (
    let i = 0;
    i < rows.length;
    i++
  ) {

    rows[i].rci9 =
      rci9[i];

    rows[i].rci26 =
      rci26[i];


    /*
     * ========================================================
     * 52週高値Factor
     *
     * ln(
     *   現在値 /
     *   直前52週高値
     * )
     * ========================================================
     */

    if (
      isFiniteNumber(
        rows[i].close
      ) &&
      isFiniteNumber(
        rows[i].high52Prev
      ) &&
      rows[i].close > 0 &&
      rows[i].high52Prev > 0
    ) {

      x52[i] =
        Math.log(
          rows[i].close /
          rows[i].high52Prev
        );
    }


    /*
     * ========================================================
     * VCP Factor
     *
     * Price contraction
     * =
     * -ln(ATR10 / ATR50)
     *
     * Volume contraction
     * =
     * -ln(VolMA10_prev / VolMA50_prev)
     * ========================================================
     */

    if (
      isFiniteNumber(
        atr10[i]
      ) &&
      isFiniteNumber(
        atr50[i]
      ) &&
      atr10[i] > 0 &&
      atr50[i] > 0 &&
      i >= 1 &&
      isFiniteNumber(
        volMa10[i-1]
      ) &&
      isFiniteNumber(
        volMa50[i-1]
      ) &&
      volMa10[i-1] > 0 &&
      volMa50[i-1] > 0
    ) {

      const priceContraction =
        -Math.log(
          atr10[i] /
          atr50[i]
        );


      const volumeContraction =
        -Math.log(
          volMa10[i-1] /
          volMa50[i-1]
        );


      xVcp[i] =
        (
          priceContraction +
          volumeContraction
        ) /
        2;
    }


    /*
     * ========================================================
     * RCI Factor
     *
     * 60%
     * =
     * RCI26
     *
     * 40%
     * =
     * RCI9の5営業日変化
     * ========================================================
     */

    if (
      isFiniteNumber(
        rci26[i]
      ) &&
      i >= 5 &&
      isFiniteNumber(
        rci9[i]
      ) &&
      isFiniteNumber(
        rci9[i-5]
      )
    ) {

      const slope =
        (
          rci9[i] -
          rci9[i-5]
        ) /
        200;


      xRciSlope[i] =
        slope;


      xRci[i] =
        0.6 *
        (
          rci26[i] /
          100
        )
        +
        0.4 *
        slope;
    }


    /*
     * ========================================================
     * 出来高Factor
     *
     * ln(
     *   当日出来高 /
     *   直前20日平均出来高
     * )
     * ========================================================
     */

    if (
      i >= 1 &&
      isFiniteNumber(
        rows[i].volume
      ) &&
      rows[i].volume > 0 &&
      isFiniteNumber(
        volMa20[i-1]
      ) &&
      volMa20[i-1] > 0
    ) {

      xVol[i] =
        Math.log(
          rows[i].volume /
          volMa20[i-1]
        );
    }


    /*
     * ========================================================
     * TOPIX相対強度
     *
     * ER20
     * =
     * stock20 -
     * TOPIX20
     *
     * ER60
     * =
     * stock60 -
     * TOPIX60
     *
     * X_RS
     * =
     * 0.6*ER20 +
     * 0.4*ER60
     * ========================================================
     */

    if (
      i >= 60
    ) {

      const topixNow =
        topixCloseByDate.get(
          rows[i].date
        );


      const topix20 =
        topixCloseByDate.get(
          rows[i-20].date
        );


      const topix60 =
        topixCloseByDate.get(
          rows[i-60].date
        );


      if (
        isFiniteNumber(
          topixNow
        ) &&
        isFiniteNumber(
          topix20
        ) &&
        isFiniteNumber(
          topix60
        ) &&
        topixNow > 0 &&
        topix20 > 0 &&
        topix60 > 0 &&
        isFiniteNumber(
          rows[i-20].close
        ) &&
        isFiniteNumber(
          rows[i-60].close
        ) &&
        rows[i-20].close > 0 &&
        rows[i-60].close > 0
      ) {

        const stock20 =
          rows[i].close /
          rows[i-20].close -
          1;


        const stock60 =
          rows[i].close /
          rows[i-60].close -
          1;


        const topixReturn20 =
          topixNow /
          topix20 -
          1;


        const topixReturn60 =
          topixNow /
          topix60 -
          1;


        rows[i].rs20 =
          stock20 -
          topixReturn20;


        rows[i].rs60 =
          stock60 -
          topixReturn60;


        xRs[i] =
          0.6 *
          rows[i].rs20
          +
          0.4 *
          rows[i].rs60;

      } else {

        rows[i].rs20 =
          null;

        rows[i].rs60 =
          null;
      }

    } else {

      rows[i].rs20 =
        null;

      rows[i].rs60 =
        null;
    }
  }


  /*
   * ==========================================================
   * Rolling Z-score
   * ==========================================================
   */

  const z52 =
    calculateRollingZ(
      x52
    );

  const zVcp =
    calculateRollingZ(
      xVcp
    );

  const zRci =
    calculateRollingZ(
      xRci
    );

  const zRciSlope =
    calculateRollingZ(
      xRciSlope
    );

  const zVol =
    calculateRollingZ(
      xVol
    );

  const zRs =
    calculateRollingZ(
      xRs
    );


  /*
   * ==========================================================
   * -1 ～ +1へ滑らかに変換
   * ==========================================================
   */

  for (
    let i = 0;
    i < rows.length;
    i++
  ) {

    rows[i].factor52 =
      smoothZ(
        z52[i]
      );


    rows[i].factorVcp =
      smoothZ(
        zVcp[i]
      );


    rows[i].factorRci =
      smoothZ(
        zRci[i]
      );


    rows[i].factorRciSlope =
      smoothZ(
        zRciSlope[i]
      );


    rows[i].factorVol =
      smoothZ(
        zVol[i]
      );


    rows[i].factorRs =
      smoothZ(
        zRs[i]
      );


    /*
     * Trend
     */
    rows[i].trendLine =
      isFiniteNumber(
        rows[i].factor52
      ) &&
      isFiniteNumber(
        rows[i].factorRs
      )
        ? (
            0.5 *
            rows[i].factor52
            +
            0.5 *
            rows[i].factorRs
          )
        : null;


    /*
     * Setup
     */
    rows[i].setupLine =
      isFiniteNumber(
        rows[i].factorVcp
      ) &&
      isFiniteNumber(
        rows[i].factorRci
      )
        ? (
            0.6 *
            rows[i].factorVcp
            +
            0.4 *
            rows[i].factorRci
          )
        : null;


    /*
     * Trigger
     */
    rows[i].triggerLine =
      isFiniteNumber(
        rows[i].factorVol
      ) &&
      isFiniteNumber(
        rows[i].factorRciSlope
      )
        ? (
            0.7 *
            rows[i].factorVol
            +
            0.3 *
            rows[i].factorRciSlope
          )
        : null;


    rows[i].strongBuyCondition =
      false;

    rows[i].strongSellCondition =
      false;

    rows[i].strongBuySignal =
      false;

    rows[i].strongSellSignal =
      false;


    /*
     * ========================================================
     * BUY
     *
     * Trigger > Setup > Trend > 0
     *
     * Trigger上昇
     *
     * Trigger-Setup乖離拡大
     *
     * 20日高値更新
     * ========================================================
     */

    if (
      i >= 1
    ) {

      const trend =
        rows[i].trendLine;

      const setup =
        rows[i].setupLine;

      const trigger =
        rows[i].triggerLine;

      const previousTrigger =
        rows[i-1].triggerLine;

      const previousSetup =
        rows[i-1].setupLine;

      const previousTrend =
        rows[i-1].trendLine;


      if (
        [
          trend,
          setup,
          trigger,
          previousTrigger,
          previousSetup
        ].every(
          isFiniteNumber
        ) &&
        isFiniteNumber(
          rows[i].high20Prev
        )
      ) {

        rows[i].strongBuyCondition =
          trigger >
          setup
          &&
          setup >
          trend
          &&
          trend >
          0
          &&
          trigger >
          previousTrigger
          &&
          (
            trigger -
            setup
          ) >
          (
            previousTrigger -
            previousSetup
          )
          &&
          rows[i].close >
          rows[i].high20Prev;
      }


      /*
       * ======================================================
       * SELL
       *
       * Trigger < Setup < Trend
       *
       * Trend低下
       *
       * 50MA割れ
       * ======================================================
       */

      if (
        [
          trend,
          setup,
          trigger,
          previousTrend
        ].every(
          isFiniteNumber
        ) &&
        isFiniteNumber(
          rows[i].ma50
        )
      ) {

        rows[i].strongSellCondition =
          trigger <
          setup
          &&
          setup <
          trend
          &&
          trend <
          previousTrend
          &&
          rows[i].close <
          rows[i].ma50;
      }
    }
  }


  /*
   * ==========================================================
   * BUY / SELLをペアにする
   *
   * BUY後の保有状態だけSELLを出す。
   * ==========================================================
   */

  let inTrendPosition =
    false;


  for (
    let i = 0;
    i < rows.length;
    i++
  ) {

    if (
      !inTrendPosition &&
      rows[i].strongBuyCondition
    ) {

      rows[i].strongBuySignal =
        true;

      inTrendPosition =
        true;

      continue;
    }


    if (
      inTrendPosition &&
      rows[i].strongSellCondition
    ) {

      rows[i].strongSellSignal =
        true;

      inTrendPosition =
        false;
    }
  }
}

// Volume-by-Price approximation:
// assign 100% of each day's volume to its close-price bin.
function calculateVolumeProfile(rows) {
  if (!rows.length) {
    return null;
  }

  const bins =
    Number(
      document.getElementById(
        "profileBins"
      ).value
    ) || 50;

  const minPrice =
    Math.min(
      ...rows.map(
        r => r.low
      )
    );

  const maxPrice =
    Math.max(
      ...rows.map(
        r => r.high
      )
    );

  if (
    !(maxPrice > minPrice)
  ) {
    return null;
  }

  const step =
    (
      maxPrice -
      minPrice
    ) /
    bins;

  const up =
    new Array(
      bins
    ).fill(0);

  const down =
    new Array(
      bins
    ).fill(0);

  for (
    const row of rows
  ) {
    let index =
      Math.floor(
        (
          row.close -
          minPrice
        ) /
        step
      );

    if (
      index === bins
    ) {
      index =
        bins - 1;
    }

    index =
      Math.max(
        0,
        Math.min(
          bins - 1,
          index
        )
      );

    if (
      row.close >=
      row.open
    ) {
      up[index] +=
        row.volume;

    } else {

      down[index] +=
        row.volume;
    }
  }

  const prices =
    Array.from(
      {
        length:
          bins
      },
      (
        _,
        i
      ) =>
        minPrice +
        (
          i +
          .5
        ) *
        step
    );

  return {
    bins,

    prices,

    widths:
      prices.map(
        () =>
          step *
          .90
      ),

    up,

    down,

    totals:
      prices.map(
        (
          _,
          i
        ) =>
          up[i] +
          down[i]
      ),

    step
  };
}


function buildSupplyDaily(
  stockRows,
  supplyRows
) {
  const source =
    [
      ...(
        supplyRows ||
        []
      )
    ].sort(
      (
        a,
        b
      ) =>
        a.date.localeCompare(
          b.date
        )
    );

  const result =
    [];

  let sourceIndex =
    0;

  let publicShortRatio =
    null;

  let publicShortInstitutions =
    [];

  let loanRatio =
    null;

  let loanBalance =
    null;

  let stockLoanBalance =
    null;

  let marginRatio =
    null;

  let marginBuy =
    null;

  let marginSell =
    null;

  for (
    const stockRow
    of stockRows
  ) {
    while (
      sourceIndex <
      source.length
      &&
      source[
        sourceIndex
      ].date <=
      stockRow.date
    ) {
      const row =
        source[
          sourceIndex
        ];

      if (
        row.publicShortRatio !==
        undefined
        &&
        row.publicShortRatio !==
        null
      ) {
        publicShortRatio =
          toNumber(
            row.publicShortRatio
          );

        publicShortInstitutions =
          Array.isArray(
            row.publicShortInstitutions
          )
            ? row.publicShortInstitutions
            : [];
      }

      if (
        row.loanRatio !==
        undefined
      ) {
        loanRatio =
          toNumber(
            row.loanRatio
          );
      }

      if (
        row.loanBalance !==
        undefined
      ) {
        loanBalance =
          toNumber(
            row.loanBalance
          );
      }

      if (
        row.stockLoanBalance !==
        undefined
      ) {
        stockLoanBalance =
          toNumber(
            row.stockLoanBalance
          );
      }

      if (
        row.marginRatio !==
        undefined
      ) {
        marginRatio =
          toNumber(
            row.marginRatio
          );
      }

      if (
        row.marginBuy !==
        undefined
      ) {
        marginBuy =
          toNumber(
            row.marginBuy
          );
      }

      if (
        row.marginSell !==
        undefined
      ) {
        marginSell =
          toNumber(
            row.marginSell
          );
      }

      sourceIndex++;
    }

    result.push({
      date:
        stockRow.date,

      publicShortRatio,

      publicShortInstitutions,

      loanRatio,

      loanBalance,

      stockLoanBalance,

      marginRatio,

      marginBuy,

      marginSell
    });
  }

  return result;
}

function rangeIncludeZero(
  values,
  paddingRatio = .10
) {
  const valid =
    values.filter(
      isFiniteNumber
    );

  if (
    !valid.length
  ) {
    return [
      -.01,
      .01
    ];
  }

  let min =
    Math.min(
      0,
      ...valid
    );

  let max =
    Math.max(
      0,
      ...valid
    );

  let span =
    max -
    min;

  if (
    span === 0
  ) {
    span =
      Math.max(
        Math.abs(
          max
        ),
        .01
      );
  }

  return [
    min -
      span *
      paddingRatio,

    max +
      span *
      paddingRatio
  ];
}


function positiveRange(
  values,
  fallback = 1
) {
  const valid =
    values.filter(
      isFiniteNumber
    );

  if (
    !valid.length
  ) {
    return [
      0,
      fallback
    ];
  }

  return [
    0,

    Math.max(
      Math.max(
        ...valid
      ) *
      1.15,

      fallback
    )
  ];
}


function positiveLogRange(
  values,
  fallbackMin = .1,
  fallbackMax = 1
) {
  const valid =
    values.filter(
      value =>
        isFiniteNumber(
          value
        ) &&
        value > 0
    );

  if (
    !valid.length
  ) {
    return [
      Math.log10(
        fallbackMin
      ),

      Math.log10(
        fallbackMax
      )
    ];
  }

  let min =
    Math.min(
      ...valid
    );

  let max =
    Math.max(
      ...valid
    );

  if (
    min === max
  ) {
    min =
      Math.max(
        min /
        1.5,

        .000001
      );

    max *=
      1.5;

  } else {

    min =
      Math.max(
        min *
        .85,

        .000001
      );

    max *=
      1.15;
  }

  return [
    Math.log10(
      min
    ),

    Math.log10(
      max
    )
  ];
}

function coverageLabel(
  item
) {
  if (
    !item
  ) {
    return "未取得";
  }

  const period =
    item.startDate ||
    item.endDate
      ? (
          `${item.startDate ?? "?"}` +
          `〜` +
          `${item.endDate ?? "?"}`
        )
      : "期間不明";

  switch (
    item.status
  ) {
    case "ok":
      return (
        `${period}`
      );

    case "partial":
      return (
        `一部取得 ${period}`
      );

    case "no_events_in_coverage":
      return (
        `公表イベントなし` +
        `（0とは断定しない） ` +
        `${period}`
      );

    case "unknown":
      return (
        `状態不明 ${period}`
      );

    case "error":
      return "取得失敗";

    default:
      return (
        `${item.status ?? "不明"} ` +
        `${period}`
      );
  }
}


/*
==============================================================
可視範囲変更時
==============================================================
*/

async function updateVisibleRange(
  start,
  end
) {
  if (
    updatingRange ||
    !currentStock
  ) {
    return;
  }

  const rows =
    visibleStockRows(
      start,
      end
    );

  if (
    !rows.length
  ) {
    return;
  }

  const profile =
    calculateVolumeProfile(
      rows
    );

  if (
    !profile
  ) {
    return;
  }

  const maxProfile =
    Math.max(
      ...profile.totals,
      1
    );

  let priceLow =
    Math.min(
      ...rows.map(
        r => r.low
      )
    );

  let priceHigh =
    Math.max(
      ...rows.map(
        r => r.high
      )
    );

  const high52 =
    rows
      .map(
        r => r.high52
      )
      .filter(
        isFiniteNumber
      );

  if (
    high52.length
  ) {
    priceHigh =
      Math.max(
        priceHigh,
        ...high52
      );
  }

  const pricePadding =
    Math.max(
      (
        priceHigh -
        priceLow
      ) *
      .045,

      profile.step
    );

  const maxVolume =
    Math.max(
      ...rows.map(
        r => r.volume
      ),
      1
    );

  const nRange =
    rangeIncludeZero(
      rows.map(
        r => r.vcp26
      )
    );

  const supplyRows =
    visibleSupplyRows(
      start,
      end
    );

  const shortRange =
    positiveRange(
      supplyRows.map(
        r =>
          r.publicShortRatio
      ),
      1
    );

  const loanRange =
    positiveLogRange(
      supplyRows.map(
        r =>
          r.loanRatio
      ),
      1
    );

  const marginRange =
    positiveRange(
      supplyRows.map(
        r =>
          r.marginRatio
      ),
      1
    );

  updatingRange =
    true;

  try {

    await Plotly.restyle(
      chart,
      {
        x:[
          profile.up
        ],

        y:[
          profile.prices
        ],

        width:[
          profile.widths
        ],

        customdata:[
          profile.up
        ]
      },
      [
        PROFILE_UP_INDEX
      ]
    );


    await Plotly.restyle(
      chart,
      {
        x:[
          profile.down
        ],

        y:[
          profile.prices
        ],

        width:[
          profile.widths
        ],

        customdata:[
          profile.down
        ]
      },
      [
        PROFILE_DOWN_INDEX
      ]
    );


    const relayout = {
      "xaxis2.range":
        [
          maxProfile *
          3.5,

          0
        ],

      "yaxis.range":
        [
          priceLow -
          pricePadding,

          priceHigh +
          pricePadding
        ],

      "yaxis3.range":
        nRange,

      "yaxis4.range":
        getSignalRange(),

      "yaxis5.range":
        shortRange,

      "yaxis6.range":
        loanRange,

      "yaxis7.range":
        marginRange
    };


    if (
      showVolumePane
    ) {
      relayout[
        "yaxis2.range"
      ] =
        [
          0,
          maxVolume *
          1.10
        ];
    }


    await Plotly.relayout(
      chart,
      relayout
    );


    currentRangeStart =
      start;

    currentRangeEnd =
      end;


    document
      .getElementById(
        "profileInfo"
      )
      .textContent =
        `価格帯別出来高：` +
        `${start} ～ ${end} ／ ` +
        `${rows.length}営業日 ／ ` +
        `${profile.bins}価格帯 ／ ` +
        `終値方式 ／ ` +
        `左＝下落（赤）、右＝上昇（青）`;

  } finally {

    updatingRange =
      false;
  }
}

        }
      </div>

      <div>

function getFavorites() {
  try {
    return JSON.parse(
      localStorage.getItem(
        "stockFavorites"
      ) ||
      "[]"
    );
  } catch {
    return [];
  }
}


function updateFavoriteButton() {
  document
    .getElementById(
      "favoriteButton"
    )
    .textContent =
      getFavorites()
        .includes(
          currentCode
        )
          ? "★ お気に入り"
          : "☆ お気に入り";
}


function toggleFavorite() {
  let favorites =
    getFavorites();

  favorites =
    favorites.includes(
      currentCode
    )
      ? favorites.filter(
          c =>
            c !==
            currentCode
        )
      : [
          ...favorites,
          currentCode
        ];

  localStorage.setItem(
    "stockFavorites",
    JSON.stringify(
      favorites
    )
  );

  updateFavoriteButton();
}


/*
==============================================================
Hover縦線
==============================================================
*/

function installHoverLine() {
  chart.on(
    "plotly_hover",
    event => {
      const point =
        event?.points?.[0];

      if (
        !point ||
        point.x ===
        undefined
      ) {
        return;
      }

      Plotly.relayout(
        chart,
        {
          "shapes[0].x0":
            point.x,

          "shapes[0].x1":
            point.x,

          "shapes[0].visible":
            true
        }
      );
    }
  );

  chart.on(
    "plotly_unhover",
    () => {
      Plotly.relayout(
        chart,
        {
          "shapes[0].visible":
            false
        }
      );
    }
  );
}

/*
==============================================================
TOPIX取得

/api/topix
==============================================================
*/

async function fetchTopix() {
  /*
   * 一度取得したTOPIXは
   * 同じページセッション中では再取得しない。
   */
  if (
    currentTopix
  ) {
    return currentTopix;
  }

  /*
   * 同時に複数銘柄読み込みが走っても
   * TOPIX APIは1回だけ叩く。
   */
  if (
    topixPromise
  ) {
    return topixPromise;
  }

  topixPromise =
    (
      async () => {

        const response =
          await fetch(
            "/api/topix",
            {
              cache:
                "no-store"
            }
          );

        if (
          !response.ok
        ) {
          throw new Error(
            `TOPIX API HTTP ${response.status}`
          );
        }

        const data =
          await response.json();

        if (
          !Array.isArray(
            data?.data
          ) ||
          !data.data.length
        ) {
          throw new Error(
            "TOPIXデータがありません"
          );
        }

        /*
         * 念のため日付順に並べる。
         */
        data.data.sort(
          (
            a,
            b
          ) =>
            a.date.localeCompare(
              b.date
            )
        );

        currentTopix =
          data;

        console.log(
          "TOPIX loaded:",
          {
            startDate:
              currentTopix.startDate,

            endDate:
              currentTopix.endDate,

            rowCount:
              currentTopix.rowCount
          }
        );

        return currentTopix;
      }
    )();

  try {

    return await topixPromise;

  } catch (
    error
  ) {

    /*
     * 失敗した場合は、
     * 次回読み込み時に再試行できるようにする。
     */
    topixPromise =
      null;

    throw error;
  }
}


/*
==============================================================
需給取得
==============================================================
*/

async function fetchSupply(
  code
) {
  try {

    const response =
      await fetch(
        `/api/supply/${code}`,
        {
          cache:
            "no-store"
        }
      );

    if (
      response.status ===
      404
    ) {
      return null;
    }

    if (
      !response.ok
    ) {
      throw new Error(
        `HTTP ${response.status}`
      );
    }

    return response.json();

  } catch (
    error
  ) {

    console.warn(
      "Supply fetch failed:",
      error
    );

    return null;
  }
}


/*
==============================================================
銘柄読み込み
==============================================================
*/

async function loadStock(
  code
) {
  code =
    code
      .trim()
      .toUpperCase();

  if (
    !/^[0-9A-Z]{4}$/.test(
      code
    )
  ) {
    throw new Error(
      "東証銘柄コードを4文字で入力してください"
    );
  }

  const status =
    document.getElementById(
      "status"
    );

  status.classList.remove(
    "error"
  );

  status.textContent =
    `${code} の株価・TOPIXを読み込み中...`;

  currentRangeStart =
    null;

  currentRangeEnd =
    null;


  /*
   * ==========================================================
   * 需給とTOPIXは並列開始
   * ==========================================================
   */

  const supplyPromise =
    fetchSupply(
      code
    );


  const benchmarkPromise =
    fetchTopix();


  /*
   * ==========================================================
   * 個別株取得
   * ==========================================================
   */

  const stockResponse =
    await fetch(
      `/api/stock/${code}`,
      {
        cache:
          "no-store"
      }
    );


  if (
    !stockResponse.ok
  ) {

    if (
      stockResponse.status ===
      404
    ) {
      throw new Error(
        `${code} の株価データはR2にありません`
      );
    }

    throw new Error(
      `株価API HTTP ${stockResponse.status}`
    );
  }


  const stockData =
    await stockResponse.json();


  if (
    !Array.isArray(
      stockData.data
    ) ||
    !stockData.data.length
  ) {
    throw new Error(
      "株価データがありません"
    );
  }


  /*
   * ==========================================================
   * TOPIXを待つ
   *
   * Trend計算に必須なので、
   * 株価描画前にここだけ待つ。
   * ==========================================================
   */

  let topixData;

  try {

    topixData =
      await benchmarkPromise;

  } catch (
    error
  ) {

    console.error(
      "TOPIX fetch failed:",
      error
    );

    throw new Error(
      `TOPIXの取得に失敗しました：${error.message}`
    );
  }


  /*
   * ==========================================================
   * 現在銘柄設定
   * ==========================================================
   */

  currentStock =
    stockData;

  currentSupply =
    null;

  currentCode =
    code;


  /*
   * ==========================================================
   * 指標計算
   *
   * ここでTOPIXを渡す。
   * ==========================================================
   */

  prepareIndicators(
    currentStock.data,
    topixData.data
  );


  /*
   * ==========================================================
   * 需給は後から入れる
   * ==========================================================
   */

  currentSupplyDaily =
    buildSupplyDaily(
      currentStock.data,
      []
    );


  document
    .getElementById(
      "stockCode"
    )
    .value =
      code;


  document
    .getElementById(
      "stockTitle"
    )
    .textContent =
      `${code} ${currentStock.name ?? ""}`;


  document
    .getElementById(
      "signalInfo"
    )
    .textContent =
      `Trend / Setup / Trigger：` +
      `TOPIX ${topixData.startDate ?? "?"} ～ ` +
      `${topixData.endDate ?? "?"} ／ ` +
      `${formatNumber(topixData.rowCount)}営業日 ／ ` +
      `RS20・RS60使用`;


  document
    .getElementById(
      "supplyInfo"
    )
    .textContent =
      "需給データを読み込み中...";


  updateFavoriteButton();


  /*
   * ==========================================================
   * 株価＋TOPIX指標は先に表示
   * ==========================================================
   */

  await drawChart();


  updateSummary();


  status.textContent =
    `株価：${currentStock.startDate} ～ ` +
    `${currentStock.endDate} ／ ` +
    `${formatNumber(currentStock.rowCount)}営業日 ／ ` +
    `TOPIX：${topixData.startDate} ～ ` +
    `${topixData.endDate} ／ ` +
    `需給を読み込み中...`;


  /*
   * ==========================================================
   * 需給待ち
   * ==========================================================
   */

  const supplyData =
    await supplyPromise;


  /*
   * 読み込み中に別銘柄へ変更されたら
   * 古い需給データを反映しない。
   */
  if (
    currentCode !==
    code
  ) {
    return;
  }


  currentSupply =
    supplyData;


  currentSupplyDaily =
    buildSupplyDaily(
      currentStock.data,

      Array.isArray(
        currentSupply?.rows
      )
        ? currentSupply.rows
        : []
    );


  if (
    currentSupply?.rows?.length
  ) {

    const cov =
      currentSupply.coverage ||
      {};


    document
      .getElementById(
        "supplyInfo"
      )
      .textContent =
        `需給：` +
        `公表空売り［${coverageLabel(cov.publicShort)}］ ／ ` +
        `貸借倍率［${coverageLabel(cov.loanRatio)}］ ／ ` +
        `信用倍率［${coverageLabel(cov.marginRatio)}］ ／ ` +
        `最終更新 ${currentSupply.updatedAt ?? "-"}`;

  } else {

    document
      .getElementById(
        "supplyInfo"
      )
      .textContent =
        "需給データはまだR2にありません。" +
        "株価・VCP・Trend/Setup/Triggerは通常表示します。";
  }


  /*
   * ==========================================================
   * 需給追加後に再描画
   * ==========================================================
   */

  await drawChart();


  updateSummary();


  status.textContent =
    `株価：${currentStock.startDate} ～ ` +
    `${currentStock.endDate} ／ ` +
    `${formatNumber(currentStock.rowCount)}営業日 ／ ` +
    `TOPIX：${topixData.startDate} ～ ` +
    `${topixData.endDate}`;
}


/*
==============================================================
期間変更
==============================================================
*/

async function setPeriod(
  period
) {
  if (
    !currentStock
  ) {
    return;
  }

  const end =
    parseDate(
      currentStock.endDate
    );

  let start =
    new Date(
      end
    );

  switch (
    period
  ) {

    case "3m":
      start.setMonth(
        start.getMonth() -
        3
      );
      break;


    case "6m":
      start.setMonth(
        start.getMonth() -
        6
      );
      break;


    case "1y":
      start.setFullYear(
        start.getFullYear() -
        1
      );
      break;


    case "3y":
      start.setFullYear(
        start.getFullYear() -
        3
      );
      break;


    case "5y":
      start.setFullYear(
        start.getFullYear() -
        5
      );
      break;


    case "10y":
      start.setFullYear(
        start.getFullYear() -
        10
      );
      break;


    case "all":
      start =
        parseDate(
          currentStock.startDate
        );
      break;
  }


  let startText =
    dateString(
      start
    );


  if (
    startText <
    currentStock.startDate
  ) {
    startText =
      currentStock.startDate;
  }


  const endText =
    currentStock.endDate;


  currentRangeStart =
    startText;

  currentRangeEnd =
    endText;


  await Plotly.relayout(
    chart,
    {
      "xaxis.range":[
        startText,
        endText
      ]
    }
  );


  await updateVisibleRange(
    startText,
    endText
  );
}
