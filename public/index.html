<!DOCTYPE html>
<html lang="ja">
<head>

    Japan Stock VCP

  <style>

    * {

    }

    body {
      margin: 0;

      color: #202124;

    .title-row {

    #stockTitle {

    }

    button {
      cursor: pointer;

    }

    button:hover {

    }

    button.active {

    }

    .period-buttons {
      display: flex;

    }

    .checkbox-control {

      gap: 5px;

      border: 1px solid #ccc;

<script>


/*
==============================================================
Colors
==============================================================
*/

const BLUE =
  "#1976d2";


const RED =
  "#d32f2f";


const ORANGE =
  "#ef6c00";


const PURPLE =
  "#7b1fa2";


const GREEN =
  "#388e3c";


const BLACK =
  "#111111";


const GRAY =
  "#616161";


/*
==============================================================
Global state
==============================================================
*/

const chart =
  document.getElementById(
    "chart"
  );


let currentStock =
  null;


let currentTopix =
  null;


let topixPromise =
  null;


let currentSignalResult =
  null;


let currentSupply =
  null;


let currentSupplyDaily =
  [];


let currentCode =
  "9984";


let currentRangeStart =
  null;


let currentRangeEnd =
  null;


let updatingRange =
  false;


let showVolumePane =
  false;


/*
 * SELL条件
 *
 * VCP N < この値
 *
 * スライダー範囲:
 * -1.00 ～ 0.00
 */
let currentVcpSellThreshold =
  -0.08;


/*
 * BUY後、VCP N < threshold を
 * 何回観測した時点からSELL判定を許可するか。
 * 1 = 1回目、2 = 2回目。
 */
let currentVcpHitOccurrence =
  1;


/*
==============================================================
Trace indexes

価格帯別出来高は
Plotly.restyle()で更新するため固定。
==============================================================
*/

const PROFILE_UP_INDEX =
  8;


const PROFILE_DOWN_INDEX =
  9;


/*
==============================================================
Utility
==============================================================
*/

function isFiniteNumber(
  value
) {

  return (
    typeof value ===
    "number"
    &&
    Number.isFinite(
      value
    )
  );
}


function toNumber(
  value
) {

  if (
    value === null
    ||
    value === undefined
    ||
    value === ""
  ) {

    return null;
  }


  const number =
    Number(
      value
    );


  return Number.isFinite(
    number
  )
    ? number
    : null;
}


function formatNumber(
  value,
  digits = 0
) {

  const number =
    toNumber(
      value
    );


  return number ===
    null
      ? "-"
      : number.toLocaleString(
          "ja-JP",
          {
            maximumFractionDigits:
              digits
          }
        );
}


function parseDate(
  text
) {

  return new Date(
    `${text}T00:00:00`
  );
}


function dateString(
  date
) {

  return (
    `${date.getFullYear()}-`
    +
    `${String(
      date.getMonth() +
      1
    ).padStart(
      2,
      "0"
    )}-`
    +
    `${String(
      date.getDate()
    ).padStart(
      2,
      "0"
    )}`
  );
}


/*
==============================================================
Chart right padding

株価の最終日より右側に12営業日分の余白を作る。
価格帯別出来高と最新ローソク足が重なりにくくなる。
==============================================================
*/

function addBusinessDays(
  dateText,
  businessDays
) {

  const date =
    parseDate(
      dateText
    );


  let added =
    0;


  while (
    added <
    businessDays
  ) {

    date.setDate(
      date.getDate() +
      1
    );


    const day =
      date.getDay();


    if (
      day !== 0
      &&
      day !== 6
    ) {

      added++;
    }
  }


  return dateString(
    date
  );
}


function getChartPaddedEndDate() {

  if (
    !currentStock?.endDate
  ) {

    return null;
  }


  return addBusinessDays(
    currentStock.endDate,
    12
  );
}



/*
==============================================================
Indicators are loaded from indicators.js
==============================================================
*/

async function recalculateSignals() {

  if (
    !currentStock
  ) {

    return;
  }


  currentSignalResult =
    window.SignalEngine.evaluate(

      currentStock.data,

      {

        vcpSellThreshold:
          currentVcpSellThreshold,

        vcpHitOccurrence:
          currentVcpHitOccurrence
      }
    );


  /*
   * BUY / SELLマーカーも変わるので
   * チャート再描画。
   */
  await drawChart();


  updateSummary();


  updateSignalSidebar();
}


/*
==============================================================
VCP SELL threshold slider
==============================================================
*/


function calculateVolumeProfile(
  rows
) {

  if (
    !rows.length
  ) {

    return null;
  }


  const bins =
    Number(
      document
        .getElementById(
          "profileBins"
        )
        .value
    ) || 50;


  const minPrice =
    Math.min(
      ...rows.map(
        row =>
          row.low
      )
    );


  const maxPrice =
    Math.max(
      ...rows.map(
        row =>
          row.high
      )
    );


  if (
    !(
      maxPrice >
      minPrice
    )
  ) {

    return null;
  }


  const step =
    (
      maxPrice -
      minPrice
    )
    /
    bins;


  const up =
    new Array(
      bins
    ).fill(
      0
    );


  const down =
    new Array(
      bins
    ).fill(
      0
    );


  for (
    const row
    of rows
  ) {

    let index =
      Math.floor(
        (
          row.close -
          minPrice
        )
        /
        step
      );


    if (
      index ===
      bins
    ) {

      index =
        bins -
        1;
    }


    index =
      Math.max(
        0,

        Math.min(
          bins -
          1,
          index
        )
      );


    if (
      row.close >=
      row.open
    ) {

      up[index] +=
        row.volume;

    } else {

      down[index] +=
        row.volume;
    }
  }


  const prices =
    Array.from(

      {
        length:
          bins
      },

      (
        _,
        index
      ) =>
        minPrice +
        (
          index +
          .5
        ) *
        step
    );


  return {

    bins,

    prices,

    widths:
      prices.map(
        () =>
          step *
          .90
      ),

    up,

    down,

    totals:
      prices.map(
        (
          _,
          index
        ) =>
          up[index]
          +
          down[index]
      ),

    step
  };
}


/*
==============================================================
Supply daily
==============================================================
*/

function buildSupplyDaily(
  stockRows,
  supplyRows
) {

  const source =
    [
      ...(
        supplyRows ||
        []
      )
    ].sort(
      (
        a,
        b
      ) =>
        a.date.localeCompare(
          b.date
        )
    );


  const result =
    [];


  let sourceIndex =
    0;


  let publicShortRatio =
    null;


  let publicShortInstitutions =
    [];


  let loanRatio =
    null;


  let loanBalance =
    null;


  let stockLoanBalance =
    null;


  let marginRatio =
    null;


  let marginBuy =
    null;


  let marginSell =
    null;


  for (
    const stockRow
    of stockRows
  ) {

    while (
      sourceIndex <
      source.length
      &&
      source[
        sourceIndex
      ].date <=
      stockRow.date
    ) {

      const row =
        source[
          sourceIndex
        ];


      if (
        row.publicShortRatio !==
        undefined
        &&
        row.publicShortRatio !==
        null
      ) {

        publicShortRatio =
          toNumber(
            row.publicShortRatio
          );


        publicShortInstitutions =
          Array.isArray(
            row.publicShortInstitutions
          )
            ? row.publicShortInstitutions
            : [];
      }


      if (
        row.loanRatio !==
        undefined
      ) {

        loanRatio =
          toNumber(
            row.loanRatio
          );
      }


      if (
        row.loanBalance !==
        undefined
      ) {

        loanBalance =
          toNumber(
            row.loanBalance
          );
      }


      if (
        row.stockLoanBalance !==
        undefined
      ) {

        stockLoanBalance =
          toNumber(
            row.stockLoanBalance
          );
      }


      if (
        row.marginRatio !==
        undefined
      ) {

        marginRatio =
          toNumber(
            row.marginRatio
          );
      }


      if (
        row.marginBuy !==
        undefined
      ) {

        marginBuy =
          toNumber(
            row.marginBuy
          );
      }


      if (
        row.marginSell !==
        undefined
      ) {

        marginSell =
          toNumber(
            row.marginSell
          );
      }


      sourceIndex++;
    }


    result.push({

      date:
        stockRow.date,

      publicShortRatio,

      publicShortInstitutions,

      loanRatio,

      loanBalance,

      stockLoanBalance,

      marginRatio,

      marginBuy,

      marginSell
    });
  }


  return result;
}


function shortInstitutionText(
  institutions
) {

  if (
    !Array.isArray(
      institutions
    )
    ||
    !institutions.length
  ) {

    return "公表対象機関なし";
  }


  return institutions
    .map(
      item => {

        const ratio =
          toNumber(
            item.ratio
          );


        return (
          `${item.name ?? "Unknown"}`
          +
          `${
            ratio !== null
              ? ` ${ratio.toFixed(2)}%`
              : ""
          }`
        );
      }
    )
    .join(
      "<br>"
    );
}


/*
==============================================================
Visible rows
==============================================================
*/

function visibleStockRows(
  start,
  end
) {

  return currentStock
    ? currentStock.data.filter(
        row =>
          row.date >=
          start
          &&
          row.date <=
          end
      )
    : [];
}


function visibleSupplyRows(
  start,
  end
) {

  return currentSupplyDaily
    .filter(
      row =>
        row.date >=
        start
        &&

/*
==============================================================
Axis range helpers
==============================================================
*/

function rangeIncludeZero(
  values,
  paddingRatio =
    .10
) {

  const valid =
    values.filter(
      isFiniteNumber
    );


  if (
    !valid.length
  ) {

    return [
      -.01,
      .01
    ];
  }


  let min =
    Math.min(
      0,
      ...valid
    );


  let max =
    Math.max(
      0,
      ...valid
    );


  let span =
    max -
    min;


  if (
    span ===
    0
  ) {

    span =
      Math.max(
        Math.abs(
          max
        ),
        .01
      );
  }


  return [

    min -
    span *
    paddingRatio,

    max +
    span *
    paddingRatio
  ];
}


function positiveRange(
  values,
  fallback =
    1
) {

  const valid =
    values.filter(
      isFiniteNumber
    );


  if (
    !valid.length
  ) {

    return [
      0,
      fallback
    ];
  }


  return [

    0,

    Math.max(

      Math.max(
        ...valid
      )
      *
      1.15,

      fallback
    )
  ];
}


function positiveLogRange(
  values,
  fallbackMin =
    .1,
  fallbackMax =
    1
) {

  const valid =
    values.filter(
      value =>
        isFiniteNumber(
          value
        )
        &&
        value >
        0
    );


  if (
    !valid.length
  ) {

    return [

      Math.log10(
        fallbackMin
      ),

      Math.log10(
        fallbackMax
      )
    ];
  }


  let min =
    Math.min(
      ...valid
    );


  let max =
    Math.max(
      ...valid
    );


  if (
    min ===
    max
  ) {

    min =
      Math.max(
        min /
        1.5,

        .000001
      );


    max *=
      1.5;

  } else {

    min =
      Math.max(
        min *
        .85,

        .000001
      );


    max *=
      1.15;
  }


  return [

    Math.log10(
      min
    ),

    Math.log10(
      max
    )
  ];
}

/*

==============================================================

function getInitialDisplayRange() {

  if (
    currentRangeStart
    &&
    currentRangeEnd
  ) {

    return {

      start:
        currentRangeStart,

      end:
        currentRangeEnd
    };
  }


  const end =
    parseDate(
      currentStock.endDate
    );


  const start =
    new Date(
      end
    );


  start.setFullYear(
    start.getFullYear() -
    1
  );


  let startText =
    dateString(
      start
    );


  if (
    startText <
    currentStock.startDate
  ) {

    startText =
      currentStock.startDate;
  }


  return {

    start:
      startText,

    end:
      getChartPaddedEndDate()
  };
}


/*
==============================================================
Supply coverage label
==============================================================
*/

function coverageLabel(
  item
) {

  if (
    !item
  ) {

    return "未取得";
  }


  const period =
    item.startDate
    ||
    item.endDate
      ? (
          `${item.startDate ?? "?"}`
          +
          `〜`
          +
          `${item.endDate ?? "?"}`
        )
      : "期間不明";


  switch (
    item.status
  ) {

    case "ok":

      return `${period}`;


    case "partial":

      return `一部取得 ${period}`;


    case "no_events_in_coverage":

      return (
        `公表イベントなし`
        +
        `（0とは断定しない） `
        +
        `${period}`
      );


    case "unknown":

      return `状態不明 ${period}`;


    case "error":

      return "取得失敗";


    default:

      return (
        `${item.status ?? "不明"} `
        +
        `${period}`
      );
  }
}


/*
==============================================================
Visible range update
==============================================================
*/

async function updateVisibleRange(
  start,
  end
) {

  if (
    updatingRange
    ||
    !currentStock
  ) {

    return;
  }


  const rows =
    visibleStockRows(
      start,
      end
    );


  if (
    !rows.length
  ) {

    return;
  }


  const profile =
    calculateVolumeProfile(
      rows
    );


  if (
    !profile
  ) {

    return;
  }


  const maxProfile =
    Math.max(
      ...profile.totals,
      1
    );


  let priceLow =
    Math.min(
      ...rows.map(
        row =>
          row.low
      )
    );


  let priceHigh =
    Math.max(
      ...rows.map(
        row =>
          row.high
      )
    );


  const high52 =
    rows
      .map(
        row =>
          row.high52
      )
      .filter(
        isFiniteNumber
      );


  if (
    high52.length
  ) {

    priceHigh =
      Math.max(
        priceHigh,
        ...high52
      );
  }


  const pricePadding =
    Math.max(

      (
        priceHigh -
        priceLow
      )
      *
      .045,

      profile.step
    );


  const maxVolume =
    Math.max(
      ...rows.map(
        row =>
          row.volume
      ),
      1
    );


  const nRange =
    rangeIncludeZero(
      rows.map(
        row =>
          row.vcp26
      )
    );


  const supplyRows =
    visibleSupplyRows(
      start,
      end
    );


  const shortRange =
    positiveRange(

      supplyRows.map(
        row =>
          row.publicShortRatio
      ),

      1
    );


  const loanRange =
    positiveLogRange(

      supplyRows.map(
        row =>
          row.loanRatio
      ),

      1
    );


  const marginRange =
    positiveRange(

      supplyRows.map(
        row =>
          row.marginRatio
      ),

      1
    );


  updatingRange =
    true;


  try {

    await Plotly.restyle(

      chart,

      {

        x:[
          profile.up
        ],

        y:[
          profile.prices
        ],

        width:[
          profile.widths
        ],

        customdata:[
          profile.up
        ]
      },

      [
        PROFILE_UP_INDEX
      ]
    );


    await Plotly.restyle(

      chart,

      {

        x:[
          profile.down
        ],

        y:[
          profile.prices
        ],

        width:[
          profile.widths
        ],

        customdata:[
          profile.down
        ]
      },

      [
        PROFILE_DOWN_INDEX
      ]
    );


    const relayout = {

      "xaxis2.range":
        [
          maxProfile *
          3.5,

          0
        ],

      "yaxis.range":
        [
          priceLow -
          pricePadding,

          priceHigh +
          pricePadding
        ],

      "yaxis3.range":
        nRange,

      "yaxis4.range":
        getSignalRange(),

      "yaxis5.range":
        shortRange,

      "yaxis6.range":
        loanRange,

      "yaxis7.range":
        marginRange
    };


    if (
      showVolumePane
    ) {

      relayout[
        "yaxis2.range"
      ] =
        [
          0,

          maxVolume *
          1.10
        ];
    }


    await Plotly.relayout(
      chart,
      relayout
    );


    currentRangeStart =
      start;


    currentRangeEnd =
      end;


    document
      .getElementById(
        "profileInfo"
      )
      .textContent =
        `価格帯別出来高：`
        +
        `${start} ～ ${end} ／ `
        +
        `${rows.length}営業日 ／ `
        +
        `${profile.bins}価格帯 ／ `
        +
        `終値方式 ／ `
        +
        `左＝下落（赤）、右＝上昇（青）`;

  } finally {

    updatingRange =
      false;
  }
}

  });

/*
==============================================================
TOPIX
==============================================================
*/

async function fetchTopix() {

  if (
    currentTopix
  ) {

    return currentTopix;
  }


  if (
    topixPromise
  ) {

    return topixPromise;
  }


  topixPromise =
    (
      async () => {

        const response =
          await fetch(
            "/api/topix",

            {
              cache:
                "no-store"
            }
          );


        if (
          !response.ok
        ) {

          throw new Error(
            `TOPIX API HTTP ${response.status}`
          );
        }


        const data =
          await response.json();


        if (
          !Array.isArray(
            data?.data
          )
          ||
          !data.data.length
        ) {

          throw new Error(
            "TOPIXデータがありません"
          );
        }


        data.data.sort(
          (
            a,
            b
          ) =>
            a.date.localeCompare(
              b.date
            )
        );


        currentTopix =
          data;


        console.log(
          "TOPIX loaded:",

          {
            startDate:
              currentTopix.startDate,

            endDate:
              currentTopix.endDate,

            rowCount:
              currentTopix.rowCount
          }
        );


        return currentTopix;
      }
    )();


  try {

    return await topixPromise;

  } catch (
    error
  ) {

    topixPromise =
      null;


    throw error;
  }
}


/*
==============================================================
Supply
==============================================================
*/

async function fetchSupply(
  code
) {

  try {

    const response =
      await fetch(

        `/api/supply/${code}`,

        {
          cache:
            "no-store"
        }
      );


    if (
      response.status ===
      404
    ) {

      return null;
    }


    if (
      !response.ok
    ) {

      throw new Error(
        `HTTP ${response.status}`
      );
    }


    return response.json();

  } catch (
    error
  ) {

    console.warn(
      "Supply fetch failed:",
      error
    );


    return null;
  }
}


/*
==============================================================
Load Stock
==============================================================
*/

async function loadStock(
  code
) {

  code =
    code
      .trim()
      .toUpperCase();


  if (
    !/^[0-9A-Z]{4}$/.test(
      code
    )
  ) {

    throw new Error(
      "東証銘柄コードを4文字で入力してください"
    );
  }


  const status =
    document.getElementById(
      "status"
    );


  status.classList.remove(
    "error"
  );


  status.textContent =
    `${code} の株価・TOPIXを読み込み中...`;


  currentRangeStart =
    null;


  currentRangeEnd =
    null;


  currentSignalResult =
    null;


  const supplyPromise =
    fetchSupply(
      code
    );


  const benchmarkPromise =
    fetchTopix();


  const stockResponse =
    await fetch(

      `/api/stock/${code}`,

      {
        cache:
          "no-store"
      }
    );


  if (
    !stockResponse.ok
  ) {

    if (
      stockResponse.status ===
      404
    ) {

      throw new Error(
        `${code} の株価データはR2にありません`
      );
    }


    throw new Error(
      `株価API HTTP ${stockResponse.status}`
    );
  }


  const stockData =
    await stockResponse.json();


  if (
    !Array.isArray(
      stockData.data
    )
    ||
    !stockData.data.length
  ) {

    throw new Error(
      "株価データがありません"
    );
  }


  let topixData;


  try {

    topixData =
      await benchmarkPromise;

  } catch (
    error
  ) {

    console.error(
      "TOPIX fetch failed:",
      error
    );


    throw new Error(
      `TOPIXの取得に失敗しました：${error.message}`
    );
  }


  currentStock =
    stockData;


  currentSupply =
    null;


  currentCode =
    code;


  /*
   * 指標計算
   */
  if (
    !window.Indicators
    ||
    typeof window.Indicators.prepare !==
      "function"
  ) {

    throw new Error(
      "indicators.js が読み込まれていません"
    );
  }


  window.Indicators.prepare(
    currentStock.data,
    topixData.data
  );


  /*
   * 売買シグナル計算
   */
  if (
    !window.SignalEngine
    ||
    typeof window.SignalEngine.evaluate !==
      "function"
  ) {

    throw new Error(
      "signal-engine.js が読み込まれていません"
    );
  }


  currentSignalResult =
    window.SignalEngine.evaluate(

      currentStock.data,

      {
        vcpSellThreshold:
          currentVcpSellThreshold,

        vcpHitOccurrence:
          currentVcpHitOccurrence
      }
    );


  currentSupplyDaily =
    buildSupplyDaily(
      currentStock.data,
      []
    );


  document
    .getElementById(
      "stockCode"
    )
    .value =
      code;


  document
    .getElementById(
      "stockTitle"
    )
    .textContent =
      `${code} ${currentStock.name ?? ""}`;


  document
    .getElementById(
      "signalInfo"
    )
    .textContent =
      `Trend / Setup / Trigger：`
      +
      `TOPIX ${topixData.startDate ?? "?"} ～ `
      +
      `${topixData.endDate ?? "?"} ／ `
      +
      `${formatNumber(topixData.rowCount)}営業日 ／ `
      +
      `BUY＝Trigger > Setup > Trend > 0 ／ `
      +
      (
        currentVcpHitOccurrence === 1
          ? `SELL(1回目)＝VCP5MA < VCP25MA ＆ VCPN < ${currentVcpSellThreshold.toFixed(2)} ＆ Trend < 5日前Trend`
          : `SELL(2回目)＝完全SELL条件成立後、VCPNが0以上へ回復し、その後0未満へ再クロス`
      );


  document
    .getElementById(
      "supplyInfo"
    )
    .textContent =
      "需給データを読み込み中...";


  updateFavoriteButton();


  await drawChart();


  updateSummary();


  updateSignalSidebar();


  status.textContent =
    `株価：${currentStock.startDate} ～ `
    +
    `${currentStock.endDate} ／ `
    +
    `${formatNumber(currentStock.rowCount)}営業日 ／ `
    +
    `TOPIX：${topixData.startDate} ～ `
    +
    `${topixData.endDate} ／ `
    +
    `需給を読み込み中...`;


  const supplyData =
    await supplyPromise;


  if (
    currentCode !==
    code
  ) {

    return;
  }


  currentSupply =
    supplyData;


  currentSupplyDaily =
    buildSupplyDaily(

      currentStock.data,

      Array.isArray(
        currentSupply?.rows
      )
        ? currentSupply.rows
        : []
    );


  if (
    currentSupply?.rows?.length
  ) {

    const coverage =
      currentSupply.coverage
      ||
      {};


    document
      .getElementById(
        "supplyInfo"
      )
      .textContent =
        `需給：`
        +
        `公表空売り［${coverageLabel(coverage.publicShort)}］ ／ `
        +
        `貸借倍率［${coverageLabel(coverage.loanRatio)}］ ／ `
        +
        `信用倍率［${coverageLabel(coverage.marginRatio)}］ ／ `
        +
        `最終更新 ${currentSupply.updatedAt ?? "-"}`;

  } else {

    document
      .getElementById(
        "supplyInfo"
      )
      .textContent =
        "需給データはまだR2にありません。"
        +
        "株価・VCP・Trend/Setup/Trigger・売買シグナルは通常表示します。";
  }


  await drawChart();


  updateSummary();


  updateSignalSidebar();


  status.textContent =
    `株価：${currentStock.startDate} ～ `
    +
    `${currentStock.endDate} ／ `
    +
    `${formatNumber(currentStock.rowCount)}営業日 ／ `
    +
    `TOPIX：${topixData.startDate} ～ `
    +
    `${topixData.endDate}`;
}


/*
==============================================================
Period
==============================================================
*/

async function setPeriod(
  period
) {

  if (
    !currentStock
  ) {

    return;
  }


  const end =
    parseDate(
      currentStock.endDate
    );


  let start =
    new Date(
      end
    );


  switch (
    period
  ) {

    case "3m":

      start.setMonth(
        start.getMonth() -
        3
      );

      break;


    case "6m":

      start.setMonth(
        start.getMonth() -
        6
      );

      break;


    case "1y":

      start.setFullYear(
        start.getFullYear() -
        1
      );

      break;


    case "3y":

      start.setFullYear(
        start.getFullYear() -
        3
      );

      break;


    case "5y":

      start.setFullYear(
        start.getFullYear() -
        5
      );

      break;


    case "10y":

      start.setFullYear(
        start.getFullYear() -
        10
      );

      break;


    case "all":

      start =
        parseDate(
          currentStock.startDate
        );

      break;
  }


  let startText =
    dateString(
      start
    );


  if (
    startText <
    currentStock.startDate
  ) {

    startText =
      currentStock.startDate;
  }


  const endText =
    getChartPaddedEndDate();


  currentRangeStart =
    startText;


  currentRangeEnd =
    endText;


  await Plotly.relayout(

    chart,

    {
      "xaxis.range":[
        startText,
        endText
      ]
    }
  );


  await updateVisibleRange(
    startText,
    endText
  );
}
