/*
==============================================================
Trace index

0  Candlestick
1  MA5
2  MA25
3  MA50
4  High MA5
5  Low MA5
6  52週高値

7  Volume Profile UP
8  Volume Profile DOWN

9  通常出来高

10 VCP N
11 VCP N 5MA
12 VCP N 25MA

13 公表機関空売り
14 貸借倍率
15 信用倍率

16 買い候補
17 売り候補
==============================================================
*/

const PROFILE_UP_INDEX =
  7;

const PROFILE_DOWN_INDEX =
  8;


/*
==============================================================
Utility
==============================================================
*/

function isFiniteNumber(
  value
) {

  return (
    typeof value ===
      "number"
    &&
    Number.isFinite(
      value
    )
  );
}


function toNumber(
  value
) {

  if (
    value === null
    ||
    value === undefined
    ||
    value === ""
  ) {

    return null;
  }


  const n =
    Number(
      value
    );


  return Number.isFinite(
    n
  )
    ? n
    : null;
}


function formatNumber(
  value,
  digits = 0
) {

  const n =
    toNumber(
      value
    );


  if (
    n === null
  ) {

    return "-";
  }


  return n.toLocaleString(
    "ja-JP",
    {
      maximumFractionDigits:
        digits
    }
  );
}


function parseDate(
  text
) {

  return new Date(
    `${text}T00:00:00`
  );
}


function dateString(
  date
) {

  const y =
    date.getFullYear();


  const m =
    String(
      date.getMonth() + 1
    )
    .padStart(
      2,
      "0"
    );


  const d =
    String(
      date.getDate()
    )
    .padStart(
      2,
      "0"
    );


  return (
    `${y}-${m}-${d}`
  );
}


/*
==============================================================
PERCENTILE.INC
==============================================================
*/

function percentileInc(
  values,
  p
) {

  if (
    !values.length
    ||
    !values.every(
      isFiniteNumber
    )
  ) {

    return null;
  }


  const sorted =
    [...values]
      .sort(
        (a, b) =>
          a - b
      );


  if (
    sorted.length ===
      1
  ) {

    return sorted[0];
  }


  const rank =
    p *
    (
      sorted.length -
      1
    );


  const lower =
    Math.floor(
      rank
    );


  const upper =
    Math.ceil(
      rank
    );


  if (
    lower === upper
  ) {

    return sorted[
      lower
    ];
  }


  const weight =
    rank -
    lower;


  return (
    sorted[lower] *
      (
        1 -
        weight
      )
    +
    sorted[upper] *
      weight
  );
}


/*
==============================================================
SMA
==============================================================
*/

function calculateSma(
  rows,
  key,
  period
) {

  const result =
    new Array(
      rows.length
    )
    .fill(
      null
    );


  for (
    let i =
      period - 1;

    i <
      rows.length;

    i++
  ) {

    const values =
      rows
        .slice(
          i -
            period +
            1,
          i + 1
        )
        .map(
          row =>
            row[key]
        );


    if (
      values.every(
        isFiniteNumber
      )
    ) {

      result[i] =
        values.reduce(
          (
            sum,
            value
          ) =>
            sum +
            value,
          0
        )
        /
        period;
    }
  }


  return result;
}


/*
==============================================================
52週高値・VCP追加指標
==============================================================
*/

function prepareIndicators(
  rows
) {

  for (
    let i = 0;
    i <
      rows.length;
    i++
  ) {

    /*
    ----------------------------------------------------------
    52週高値
    252営業日のHigh最高値
    ----------------------------------------------------------
    */

    if (
      i >= 251
    ) {

      let maxHigh =
        -Infinity;


      for (
        let j =
          i - 251;

        j <= i;

        j++
      ) {

        maxHigh =
          Math.max(
            maxHigh,
            rows[j].high
          );
      }


      rows[i].high52 =
        maxHigh;

    }
    else {

      rows[i].high52 =
        null;
    }


    /*
    ----------------------------------------------------------
    Nの5日変化
    ----------------------------------------------------------
    */

    if (
      !isFiniteNumber(
        rows[i]
          .vcp26Delta5
      )
      &&
      i >= 5
      &&
      isFiniteNumber(
        rows[i]
          .vcp26
      )
      &&
      isFiniteNumber(
        rows[i - 5]
          .vcp26
      )
    ) {

      rows[i]
        .vcp26Delta5 =
          rows[i]
            .vcp26
          -
          rows[i - 5]
            .vcp26;
    }


    /*
    ----------------------------------------------------------
    N 5日変化の
    120日P10/P90
    ----------------------------------------------------------
    */

    if (
      i >= 119
    ) {

      const values =
        rows
          .slice(
            i - 119,
            i + 1
          )
          .map(
            row =>
              row
                .vcp26Delta5
          );


      rows[i]
        .deltaP10 =
          percentileInc(
            values,
            0.10
          );


      rows[i]
        .deltaP90 =
          percentileInc(
            values,
            0.90
          );

    }
    else {

      rows[i]
        .deltaP10 =
          null;


      rows[i]
        .deltaP90 =
          null;
    }


    /*
    ----------------------------------------------------------
    候補判定

    K/L/Mは表示しないが
    内部ではdailyVcpを利用
    ----------------------------------------------------------
    */

    const contraction =
      isFiniteNumber(
        rows[i]
          .dailyVcp
      )
      &&
      isFiniteNumber(
        rows[i]
          .dailyVcpP10
      )
      &&
      rows[i]
        .dailyVcp
      <=
      rows[i]
        .dailyVcpP10;


    rows[i]
      .buyCandidate =
        contraction
        &&
        isFiniteNumber(
          rows[i]
            .vcp26Delta5
        )
        &&
        isFiniteNumber(
          rows[i]
            .deltaP90
        )
        &&
        rows[i]
          .vcp26Delta5
        >=
        rows[i]
          .deltaP90;


    rows[i]
      .sellCandidate =
        contraction
        &&
        isFiniteNumber(
          rows[i]
            .vcp26Delta5
        )
        &&
        isFiniteNumber(
          rows[i]
            .deltaP10
        )
        &&
        rows[i]
          .vcp26Delta5
        <=
        rows[i]
          .deltaP10;
  }


  /*
  ------------------------------------------------------------
  VCP N 5MA
  ------------------------------------------------------------
  */

  const nMa5 =
    calculateSma(
      rows,
      "vcp26",
      5
    );


  /*
  ------------------------------------------------------------
  VCP N 25MA
  ------------------------------------------------------------
  */

  const nMa25 =
    calculateSma(
      rows,
      "vcp26",
      25
    );


  for (
    let i = 0;
    i <
      rows.length;
    i++
  ) {

    rows[i]
      .vcp26Ma5 =
        nMa5[i];


    rows[i]
      .vcp26Ma25 =
        nMa25[i];
  }
}


/*
==============================================================
価格帯別出来高

終値方式

各日の全出来高を
その日の終値価格帯へ100%割当
==============================================================
*/

function calculateVolumeProfile(
  rows
) {

  if (
    !rows.length
  ) {

    return null;
  }


  const bins =
    Number(
      document
        .getElementById(
          "profileBins"
        )
        .value
    )
    ||
    50;


  const minPrice =
    Math.min(
      ...rows.map(
        row =>
          row.low
      )
    );


  const maxPrice =
    Math.max(
      ...rows.map(
        row =>
          row.high
      )
    );


  if (
    maxPrice <=
      minPrice
  ) {

    return null;
  }


  const step =
    (
      maxPrice -
      minPrice
    )
    /
    bins;


  const up =
    new Array(
      bins
    )
    .fill(
      0
    );


  const down =
    new Array(
      bins
    )
    .fill(
      0
    );


  for (
    const row
    of rows
  ) {

    let index =
      Math.floor(
        (
          row.close -
          minPrice
        )
        /
        step
      );


    if (
      index ===
        bins
    ) {

      index =
        bins - 1;
    }


    index =
      Math.max(
        0,
        Math.min(
          bins - 1,
          index
        )
      );


    /*
      上昇日：青
      下落日：赤
    */

    if (
      row.close >=
        row.open
    ) {

      up[index] +=
        row.volume;

    }
    else {

      down[index] +=
        row.volume;
    }
  }


  const prices =
    new Array(
      bins
    )
    .fill(
      0
    )
    .map(
      (
        _,
        i
      ) =>
        minPrice
        +
        (
          i + 0.5
        )
        *
        step
    );


  const widths =
    prices.map(
      () =>
        step *
        0.90
    );


  const totals =
    prices.map(
      (
        _,
        i
      ) =>
        up[i] +
        down[i]
    );


  return {

    bins:
      bins,

    prices:
      prices,

    widths:
      widths,

    up:
      up,

    down:
      down,

    totals:
      totals,

    step:
      step
  };
}


/*
==============================================================
需給を株価営業日へForward Fill
==============================================================
*/

function buildSupplyDaily(
  stockRows,
  supplyRows
) {

  const source =
    [
      ...(
        supplyRows ??
        []
      )
    ]
    .sort(
      (
        a,
        b
      ) =>
        a.date
          .localeCompare(
            b.date
          )
    );


  const result =
    [];


  let sourceIndex =
    0;


  let shortRatio =
    null;

  let shortInstitutions =
    [];


  let loanRatio =
    null;

  let marginRatio =
    null;


  let loanBalance =
    null;

  let stockLoanBalance =
    null;


  let marginBuy =
    null;

  let marginSell =
    null;


  for (
    const stockRow
    of stockRows
  ) {

    while (
      sourceIndex <
        source.length
      &&
      source[
        sourceIndex
      ].date <=
        stockRow.date
    ) {

      const row =
        source[
          sourceIndex
        ];


      if (
        row
          .publicShortRatio
        !==
        undefined
        &&
        row
          .publicShortRatio
        !==
        null
      ) {

        shortRatio =
          toNumber(
            row
              .publicShortRatio
          );


        shortInstitutions =
          Array.isArray(
            row
              .publicShortInstitutions
          )
          ?
          row
            .publicShortInstitutions
          :
          [];
      }


      if (
        row.loanRatio
        !==
        undefined
        &&
        row.loanRatio
        !==
        null
      ) {

        loanRatio =
          toNumber(
            row.loanRatio
          );
      }


      if (
        row.loanBalance
        !==
        undefined
      ) {

        loanBalance =
          toNumber(
            row.loanBalance
          );
      }


      if (
        row
          .stockLoanBalance
        !==
        undefined
      ) {

        stockLoanBalance =
          toNumber(
            row
              .stockLoanBalance
          );
      }


      if (
        row.marginRatio
        !==
        undefined
        &&
        row.marginRatio
        !==
        null
      ) {

        marginRatio =
          toNumber(
            row.marginRatio
          );
      }


      if (
        row.marginBuy
        !==
        undefined
      ) {

        marginBuy =
          toNumber(
            row.marginBuy
          );
      }


      if (
        row.marginSell
        !==
        undefined
      ) {

        marginSell =
          toNumber(
            row.marginSell
          );
      }


      sourceIndex++;
    }


    result.push({

      date:
        stockRow.date,

      publicShortRatio:
        shortRatio,

      publicShortInstitutions:
        shortInstitutions,

      loanRatio:
        loanRatio,

      loanBalance:
        loanBalance,

      stockLoanBalance:
        stockLoanBalance,

      marginRatio:
        marginRatio,

      marginBuy:
        marginBuy,

      marginSell:
        marginSell
    });
  }


  return result;
}


/*
==============================================================
機関別空売り Hover
==============================================================
*/

function shortInstitutionText(
  institutions
) {

  if (
    !Array.isArray(
      institutions
    )
    ||
    !institutions.length
  ) {

    return (
      "公表対象機関なし"
    );
  }


  return institutions
    .map(
      item => {

        const ratio =
          toNumber(
            item.ratio
          );


        return (
          `${item.name ?? "Unknown"}`
          +
          (
            ratio !== null
              ?
                ` ${ratio.toFixed(2)}%`
              :
                ""
          )
        );
      }
    )
    .join(
      "<br>"
    );
}

表示期間データ

  return currentStock

/*
==============================================================
Y軸レンジ
==============================================================
*/

function rangeIncludeZero(
  values,
  paddingRatio =
    0.10
) {

  const valid =
    values.filter(
      isFiniteNumber
    );


  if (
    !valid.length
  ) {

    return [
      -0.01,
      0.01
    ];
  }


  let min =
    Math.min(
      0,
      ...valid
    );


  let max =
    Math.max(
      0,
      ...valid
    );


  let span =
    max -
    min;


  if (
    span === 0
  ) {

    span =
      Math.max(
        Math.abs(
          max
        ),
        0.01
      );
  }


  const padding =
    span *
    paddingRatio;


  return [
    min -
      padding,
    max +
      padding
  ];
}


function positiveRange(
  values,
  fallback =
    1
) {

  const valid =
    values.filter(
      isFiniteNumber
    );


  if (
    !valid.length
  ) {

    return [
      0,
      fallback
    ];
  }


  const max =
    Math.max(
      ...valid
    );


  return [
    0,
    Math.max(
      max *
      1.15,
      fallback
    )
  ];
}


/*
==============================================================
ペイン配置

/*
==============================================================
現在の表示範囲取得
==============================================================
*/

function getInitialDisplayRange() {

  /*
    チェックボックス切替などの
    再描画では現在範囲を維持
  */

  if (
    currentRangeStart
    &&
    currentRangeEnd
  ) {

    return {

      start:
        currentRangeStart,

      end:
        currentRangeEnd
    };
  }


  const end =
    parseDate(
      currentStock.endDate
    );


  const start =
    new Date(
      end
    );


  start.setFullYear(
    start.getFullYear() -
      1
  );


  let startText =
    dateString(
      start
    );


  if (
    startText <
      currentStock.startDate
  ) {

    startText =
      currentStock.startDate;
  }


  return {

    start:
      startText,

    end:
      currentStock.endDate
  };
}


/*
==============================================================
表示範囲更新
==============================================================
*/

async function updateVisibleRange(
  start,
  end
) {

  if (
    updatingRange
    ||
    !currentStock
  ) {

    return;
  }


  const rows =
    visibleStockRows(
      start,
      end
    );


  if (
    !rows.length
  ) {

    return;
  }


  const profile =
    calculateVolumeProfile(
      rows
    );


  if (
    !profile
  ) {

    return;
  }


  const maxProfile =
    Math.max(
      ...profile.totals,
      1
    );


  /*
  ------------------------------------------------------------
  株価Y
  ------------------------------------------------------------
  */

  let priceLow =
    Math.min(
      ...rows.map(
        row =>
          row.low
      )
    );


  let priceHigh =
    Math.max(
      ...rows.map(
        row =>
          row.high
      )
    );


  const high52Values =
    rows
      .map(
        row =>
          row.high52
      )
      .filter(
        isFiniteNumber
      );


  if (
    high52Values.length
  ) {

    priceHigh =
      Math.max(
        priceHigh,
        ...high52Values
      );
  }


  const pricePadding =
    Math.max(
      (
        priceHigh -
        priceLow
      ) *
      0.045,
      profile.step
    );


  /*
  ------------------------------------------------------------
  通常出来高
  ------------------------------------------------------------
  */

  const maxVolume =
    Math.max(
      ...rows.map(
        row =>
          row.volume
      ),
      1
    );


  /*
  ------------------------------------------------------------
  VCP N
  ------------------------------------------------------------
  */

  const nRange =
    rangeIncludeZero(
      rows.map(
        row =>
          row.vcp26
      )
    );


  /*
  ------------------------------------------------------------
  需給
  ------------------------------------------------------------
  */

  const supplyRows =
    visibleSupplyRows(
      start,
      end
    );


  const shortRange =
    positiveRange(
      supplyRows.map(
        row =>
          row
            .publicShortRatio
      ),
      1
    );


  const ratioRange =
    positiveRange(
      [

        ...supplyRows.map(
          row =>
            row.loanRatio
        ),

        ...supplyRows.map(
          row =>
            row.marginRatio
        )
      ],
      1
    );


  updatingRange =
    true;


  try {

    /*
    ----------------------------------------------------------
    価格帯別出来高

    xaxis2は逆向き。

    青を先にStack
    赤を後にStack

    [赤][青] | 右端
    ----------------------------------------------------------
    */

    await Plotly.restyle(
      chart,
      {

        x: [
          profile.up
        ],

        y: [
          profile.prices
        ],

        width: [
          profile.widths
        ],

        customdata: [
          profile.up
        ]
      },
      [
        PROFILE_UP_INDEX
      ]
    );


    await Plotly.restyle(
      chart,
      {

        x: [
          profile.down
        ],

        y: [
          profile.prices
        ],

        width: [
          profile.widths
        ],

        customdata: [
          profile.down
        ]
      },
      [
        PROFILE_DOWN_INDEX
      ]
    );


    const relayoutData = {

      "xaxis2.range": [
        maxProfile *
          3.5,
        0
      ],

      "yaxis.range": [
        priceLow -
          pricePadding,

        priceHigh +
          pricePadding
      ],

      "yaxis3.range":
        nRange,

      "yaxis4.range":
        shortRange,

      "yaxis5.range":
        ratioRange
    };


    /*
      出来高ペインON時だけ
      出来高軸を調整
    */

    if (
      showVolumePane
    ) {

      relayoutData[
        "yaxis2.range"
      ] = [
        0,
        maxVolume *
          1.10
      ];
    }


    await Plotly.relayout(
      chart,
      relayoutData
    );


    currentRangeStart =
      start;


    currentRangeEnd =
      end;


    document
      .getElementById(
        "profileInfo"
      )
      .textContent =
        `価格帯別出来高：${start} ～ ${end} ／ `
        +
        `${rows.length}営業日 ／ `
        +
        `${profile.bins}価格帯 ／ `
        +
        `終値方式 ／ `
        +
        `左＝下落（赤）、右＝上昇（青）`;

  }
  finally {

    updatingRange =
      false;
  }
}

お気に入り
==============================================================
*/

function getFavorites() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "stockFavorites"
      )
      ||
      "[]"
    );

  }
  catch {

    return [];
  }
}


function updateFavoriteButton() {

  const favorites =
    getFavorites();


  const active =
    favorites.includes(
      currentCode
    );


  document
    .getElementById(
      "favoriteButton"
    )
    .textContent =
      active
        ?
          "★ お気に入り"
        :
          "☆ お気に入り";
}


function toggleFavorite() {

  let favorites =
    getFavorites();


  if (
    favorites.includes(
      currentCode
    )
  ) {

    favorites =
      favorites.filter(
        code =>
          code !==
          currentCode
      );

  }
  else {

    favorites.push(
      currentCode
    );
  }


  localStorage.setItem(
    "stockFavorites",
    JSON.stringify(
      favorites
    )
  );


  updateFavoriteButton();
}


/*
==============================================================
共通縦線

全ペインを
1本の破線で貫く
==============================================================
*/

function installHoverLine() {

  chart.on(
    "plotly_hover",
    event => {

      const point =
        event
          ?.points
          ?.[0];


      if (
        !point
        ||
        point.x ===
          undefined
      ) {

        return;
      }


      Plotly.relayout(
        chart,
        {

          "shapes[0].x0":
            point.x,

          "shapes[0].x1":
            point.x,

          "shapes[0].visible":
            true
        }
      );
    }
  );


  chart.on(
    "plotly_unhover",
    () => {

      Plotly.relayout(
        chart,
        {

          "shapes[0].visible":
            false
        }
      );
    }
  );
}

async function fetchSupply(
  code
) {

  try {

    const response =
      await fetch(
        `/api/supply/${code}`,
        {

          cache:
            "no-store"
        }
      );


    if (
      response.status ===
        404
    ) {

      return null;
    }


    if (
      !response.ok
    ) {

      throw new Error(
        `HTTP ${response.status}`
      );
    }


    return await response.json();

  }
  catch (
    error
  ) {

    console.warn(
      "Supply fetch failed:",
      error
    );


    return null;
  }
}


/*

銘柄ロード
==============================================================
*/

async function loadStock(
  code
) {

  code =
    code
      .trim()
      .toUpperCase();


  if (
    !/^[0-9A-Z]{4}$/
      .test(
        code
      )
  ) {

    throw new Error(
      "東証銘柄コードを4文字で入力してください"
    );
  }


  const status =
    document
      .getElementById(
        "status"
      );


  status
    .classList
    .remove(
      "error"
    );


  status.textContent =
    `${code} を読み込み中...`;


  /*
    新しい銘柄なので
    表示期間を初期化
  */

  currentRangeStart =
    null;


  currentRangeEnd =
    null;


  const [
    stockResponse,
    supplyData
  ] =
    await Promise.all(
      [

        fetch(
          `/api/stock/${code}`,
          {

            cache:
              "no-store"
          }
        ),

        fetchSupply(
          code
        )

      ]
    );


  if (
    !stockResponse.ok
  ) {

    if (
      stockResponse.status ===
        404
    ) {

      throw new Error(
        `${code} の株価データはR2にありません`
      );
    }


    throw new Error(
      `株価API HTTP ${stockResponse.status}`
    );
  }


  const stockData =
    await stockResponse.json();


  if (
    !Array.isArray(
      stockData.data
    )
    ||
    !stockData.data.length
  ) {

    throw new Error(
      "株価データがありません"
    );
  }


  currentStock =
    stockData;


  currentSupply =
    supplyData;


  currentCode =
    code;


  prepareIndicators(
    currentStock.data
  );


  currentSupplyDaily =
    buildSupplyDaily(

      currentStock.data,

      Array.isArray(
        currentSupply
          ?.rows
      )
      ?
        currentSupply.rows
      :
        []
    );


  document
    .getElementById(
      "stockCode"
    )
    .value =
      code;


  document
    .getElementById(
      "stockTitle"
    )
    .textContent =
      `${code} ${currentStock.name ?? ""}`;


  if (
    currentSupply
    &&
    Array.isArray(
      currentSupply.rows
    )
    &&
    currentSupply.rows.length
  ) {

    document
      .getElementById(
        "supplyInfo"
      )
      .textContent =
        `需給：公表機関空売り＋貸借倍率＋信用倍率 ／ `
        +
        `最終更新 ${currentSupply.updatedAt ?? "-"}`;

  }
  else {

    document
      .getElementById(
        "supplyInfo"
      )
      .textContent =
        "需給データはまだR2にありません。"
        +
        "株価・VCPは通常表示します。";
  }


  updateFavoriteButton();


  await drawChart();


  updateSummary();


  status.textContent =
    `株価：${currentStock.startDate} ～ ${currentStock.endDate} ／ `
    +
    `${formatNumber(currentStock.rowCount)}営業日`;
}


/*
==============================================================
期間変更
==============================================================

async function setPeriod(
  period
) {

  if (
    !currentStock
  ) {

    return;
  }


  const end =
    parseDate(
      currentStock.endDate
    );


  let start =
    new Date(
      end
    );


  switch (
    period
  ) {

    case "3m":

      start.setMonth(
        start.getMonth() -
          3
      );

      break;


    case "6m":

      start.setMonth(
        start.getMonth() -
          6
      );

      break;


    case "1y":

      start.setFullYear(
        start.getFullYear() -
          1
      );

      break;


    case "3y":

      start.setFullYear(
        start.getFullYear() -
          3
      );

      break;


    case "5y":

      start.setFullYear(
        start.getFullYear() -
          5
      );

      break;


    case "10y":

      start.setFullYear(
        start.getFullYear() -
          10
      );

      break;


    case "all":

      start =
        parseDate(
          currentStock.startDate
        );

      break;
  }


  let startText =
    dateString(
      start
    );


  if (
    startText <
      currentStock.startDate
  ) {

    startText =
      currentStock.startDate;
  }


  const endText =
    currentStock.endDate;


  currentRangeStart =
    startText;


  currentRangeEnd =
    endText;


  await Plotly.relayout(
    chart,
    {

      "xaxis.range": [
        startText,
        endText
      ]
    }
  );


  await updateVisibleRange(
    startText,
    endText
  );
}
