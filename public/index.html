<script>

const BLUE = "#1976d2";
const RED = "#d32f2f";

let currentStock = null;
let currentCode = "9984";

let currentRangeStart = null;
let currentRangeEnd = null;

let profileUpdating = false;

const chart =
  document.getElementById("chart");

/*
 * Trace index
 *
 * 0  Candle
 * 1  5MA
 * 2  25MA
 * 3  50MA
 * 4  High 5MA
 * 5  Low 5MA
 * 6  52-week high
 * 7  Volume Profile UP   ← 青・右側
 * 8  Volume Profile DOWN ← 赤・左側
 * 9  Daily Volume
 * 10 Daily VCP
 * 11 Daily VCP P10
 * 12 VCP26
 * 13 VCP26 Delta5
 * 14 Buy
 * 15 Sell
 */

const PROFILE_UP_INDEX = 7;
const PROFILE_DOWN_INDEX = 8;


// ============================================================
// Utility
// ============================================================

function finite(value) {
  return (
    typeof value === "number" &&
    Number.isFinite(value)
  );
}

function formatNumber(
  value,
  digits = 0
) {

  if (
    !finite(
      Number(value)
    )
  ) {
    return "-";
  }

  return Number(value)
    .toLocaleString(
      "ja-JP",
      {
        maximumFractionDigits:
          digits
      }
    );
}

function parseDate(text) {
  return new Date(
    `${text}T00:00:00`
  );
}

function dateString(date) {

  const y =
    date.getFullYear();

  const m =
    String(
      date.getMonth() + 1
    ).padStart(2, "0");

  const d =
    String(
      date.getDate()
    ).padStart(2, "0");

  return `${y}-${m}-${d}`;
}


// ============================================================
// Percentile.INC
// ============================================================

function percentileInc(
  values,
  p
) {

  if (
    !values.length ||
    !values.every(finite)
  ) {
    return null;
  }

  const sorted =
    [...values].sort(
      (a, b) =>
        a - b
    );

  if (
    sorted.length === 1
  ) {
    return sorted[0];
  }

  const rank =
    p *
    (sorted.length - 1);

  const lower =
    Math.floor(rank);

  const upper =
    Math.ceil(rank);

  if (
    lower === upper
  ) {
    return sorted[lower];
  }

  const weight =
    rank - lower;

  return (
    sorted[lower] *
      (1 - weight) +
    sorted[upper] *
      weight
  );
}


// ============================================================
// 追加指標
//
// 52週高値
// VCP買い候補・売り候補
// ============================================================

function prepareIndicators(rows) {

  for (
    let i = 0;
    i < rows.length;
    i++
  ) {

    // --------------------------------------------------------
    // 52週高値
    //
    // 252営業日のHigh最高値
    // --------------------------------------------------------

    if (i >= 251) {

      let high52 =
        -Infinity;

      for (
        let j = i - 251;
        j <= i;
        j++
      ) {

        high52 =
          Math.max(
            high52,
            rows[j].high
          );
      }

      rows[i].high52 =
        high52;

    }
    else {

      rows[i].high52 =
        null;
    }


    // --------------------------------------------------------
    // vcp26Delta5
    // 直近120日 P10/P90
    // --------------------------------------------------------

    if (i >= 119) {

      const values =
        rows
          .slice(
            i - 119,
            i + 1
          )
          .map(
            row =>
              row.vcp26Delta5
          );

      rows[i].deltaP10 =
        percentileInc(
          values,
          0.10
        );

      rows[i].deltaP90 =
        percentileInc(
          values,
          0.90
        );

    }
    else {

      rows[i].deltaP10 =
        null;

      rows[i].deltaP90 =
        null;
    }


    // --------------------------------------------------------
    // 日次VCPが120日下位10%
    // --------------------------------------------------------

    const contraction =
      finite(
        rows[i].dailyVcp
      ) &&
      finite(
        rows[i].dailyVcpP10
      ) &&
      rows[i].dailyVcp <=
        rows[i].dailyVcpP10;


    // --------------------------------------------------------
    // 買い候補
    //
    // ① 日次VCPが120日下位10%
    // ② 26日累積差5日変化が120日上位10%
    // --------------------------------------------------------

    rows[i].buyCandidate =
      contraction &&
      finite(
        rows[i].vcp26Delta5
      ) &&
      finite(
        rows[i].deltaP90
      ) &&
      rows[i].vcp26Delta5 >=
        rows[i].deltaP90;


    // --------------------------------------------------------
    // 売り候補
    //
    // ① 日次VCPが120日下位10%
    // ② 26日累積差5日変化が120日下位10%
    // --------------------------------------------------------

    rows[i].sellCandidate =
      contraction &&
      finite(
        rows[i].vcp26Delta5
      ) &&
      finite(
        rows[i].deltaP10
      ) &&
      rows[i].vcp26Delta5 <=
        rows[i].deltaP10;
  }
}


// ============================================================
// 価格帯別出来高
//
// 1日の出来高を終値価格帯へ100%割当。
// 同じ価格帯の1本の棒を
//
// [ 赤：下落 ][ 青：上昇 ]
//
// と分割する。
// ============================================================

function calculateVolumeProfile(
  rows
) {

  if (!rows.length) {
    return null;
  }

  const bins =
    Number(
      document
        .getElementById(
          "profileBins"
        )
        .value
    ) || 50;


  const minPrice =
    Math.min(
      ...rows.map(
        row => row.low
      )
    );

  const maxPrice =
    Math.max(
      ...rows.map(
        row => row.high
      )
    );

  if (
    maxPrice <= minPrice
  ) {
    return null;
  }


  const step =
    (
      maxPrice -
      minPrice
    ) /
    bins;


  const up =
    new Array(bins)
      .fill(0);

  const down =
    new Array(bins)
      .fill(0);


  for (
    const row
    of rows
  ) {

    let index =
      Math.floor(
        (
          row.close -
          minPrice
        ) /
        step
      );

    if (
      index === bins
    ) {
      index =
        bins - 1;
    }

    index =
      Math.max(
        0,
        Math.min(
          bins - 1,
          index
        )
      );


    if (
      row.close >= row.open
    ) {

      up[index] +=
        row.volume;

    }
    else {

      down[index] +=
        row.volume;
    }
  }


  const prices =
    new Array(bins)
      .fill(0)
      .map(
        (_, i) =>
          minPrice +
          (
            i + 0.5
          ) *
          step
      );


  const widths =
    prices.map(
      () =>
        step * 0.90
    );


  const totals =
    prices.map(
      (_, i) =>
        up[i] +
        down[i]
    );


  return {
    prices,
    up,
    down,
    totals,
    widths,
    step,
    bins
  };
}


// ============================================================
// 表示期間のRows
// ============================================================

function visibleRows(
  start,
  end
) {

  if (!currentStock) {
    return [];
  }

  return currentStock.data
    .filter(
      row =>
        row.date >= start &&
        row.date <= end
    );
}


// ============================================================
// 価格帯別出来高の更新
// ============================================================

async function updateVolumeProfile(
  start,
  end
) {

  if (
    profileUpdating ||
    !currentStock
  ) {
    return;
  }


  const rows =
    visibleRows(
      start,
      end
    );

  if (!rows.length) {
    return;
  }


  const profile =
    calculateVolumeProfile(
      rows
    );

  if (!profile) {
    return;
  }


  const maxTotal =
    Math.max(
      ...profile.totals,
      1
    );


  let low =
    Math.min(
      ...rows.map(
        row => row.low
      )
    );

  let high =
    Math.max(
      ...rows.map(
        row => row.high
      )
    );


  const high52 =
    rows
      .map(
        row =>
          row.high52
      )
      .filter(finite);

  if (
    high52.length
  ) {

    high =
      Math.max(
        high,
        ...high52
      );
  }


  const padding =
    Math.max(
      (
        high - low
      ) *
      0.045,
      profile.step
    );


  profileUpdating =
    true;


  try {

    /*
     * 重要：
     *
     * xaxis2は逆向き。
     *
     * 0がチャート右端、
     * 値が大きくなるほど左へ伸びる。
     *
     * stackで
     *
     * ① 青を先に置く
     * ② 赤を後に積む
     *
     * ことで視覚的に
     *
     * [赤][青]|右端
     *
     * になる。
     */

    await Plotly.restyle(
      chart,
      {
        x: [
          profile.up
        ],

        y: [
          profile.prices
        ],

        width: [
          profile.widths
        ],

        customdata: [
          profile.up
        ]
      },
      [
        PROFILE_UP_INDEX
      ]
    );


    await Plotly.restyle(
      chart,
      {
        x: [
          profile.down
        ],

        y: [
          profile.prices
        ],

        width: [
          profile.widths
        ],

        customdata: [
          profile.down
        ]
      },
      [
        PROFILE_DOWN_INDEX
      ]
    );


    /*
     * maxTotal × 3.5
     *
     * → 最大の価格帯出来高が
     *   チャート横幅の約28%を占める。
     */

    await Plotly.relayout(
      chart,
      {

        "xaxis2.range": [
          maxTotal * 3.5,
          0
        ],

        "yaxis.range": [
          low - padding,
          high + padding
        ]
      }
    );


    currentRangeStart =
      start;

    currentRangeEnd =
      end;


    document
      .getElementById(
        "profileInfo"
      )
      .textContent =
        `価格帯別出来高：${start} ～ ${end} ／ ` +
        `${rows.length}営業日 ／ ` +
        `${profile.bins}価格帯 ／ ` +
        `左＝下落出来高（赤）、右＝上昇出来高（青） ／ ` +
        `出来高は各日の終値価格帯へ全量割当`;

  }
  finally {

    profileUpdating =
      false;
  }
}


// ============================================================
// Summary
// ============================================================

function updateSummary(
  data
) {

  const rows =
    data.data;

  const latest =
    rows[
      rows.length - 1
    ];


  const buyCount =
    rows.filter(
      row =>
        row.buyCandidate
    ).length;


  const sellCount =
    rows.filter(
      row =>
        row.sellCandidate
    ).length;


  let signal =
    "候補なし";

  let signalClass =
    "";


  if (
    latest.buyCandidate
  ) {

    signal =
      "▲ 買い候補";

    signalClass =
      "buy";
  }


  if (
    latest.sellCandidate
  ) {

    signal =
      "▼ 売り候補";

    signalClass =
      "sell";
  }


  document
    .getElementById(
      "summary"
    )
    .innerHTML = `

      <div>
        <span class="summary-label">
          終値
        </span>
        <strong>
          ${formatNumber(latest.close, 2)}
        </strong>
      </div>

      <div>
        <span class="summary-label">
          出来高
        </span>
        ${formatNumber(latest.volume)}
      </div>

      <div>
        <span class="summary-label">
          5MA
        </span>
        ${formatNumber(latest.ma5, 2)}
      </div>

      <div>
        <span class="summary-label">
          25MA
        </span>
        ${formatNumber(latest.ma25, 2)}
      </div>

      <div>
        <span class="summary-label">
          50MA
        </span>
        ${formatNumber(latest.ma50, 2)}
      </div>

      <div>
        <span class="summary-label">
          52週高値
        </span>
        ${formatNumber(latest.high52, 2)}
      </div>

      <div class="${signalClass}">
        ${signal}
      </div>

      <div>
        <span class="summary-label">
          10年買い候補
        </span>
        ${buyCount}
      </div>

      <div>
        <span class="summary-label">
          10年売り候補
        </span>
        ${sellCount}
      </div>
    `;
}


// ============================================================
// お気に入り
// ============================================================

function getFavorites() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "stockFavorites"
      ) ||
      "[]"
    );

  }
  catch {

    return [];
  }
}


function updateFavoriteButton() {

  const button =
    document.getElementById(
      "favoriteButton"
    );

  const favorites =
    getFavorites();

  const active =
    favorites.includes(
      currentCode
    );


  button.textContent =
    active
      ? "★ お気に入り"
      : "☆ お気に入り";
}


function toggleFavorite() {

  let favorites =
    getFavorites();


  if (
    favorites.includes(
      currentCode
    )
  ) {

    favorites =
      favorites.filter(
        code =>
          code !== currentCode
      );

  }
  else {

    favorites.push(
      currentCode
    );
  }


  localStorage.setItem(
    "stockFavorites",
    JSON.stringify(
      favorites
    )
  );


  updateFavoriteButton();
}


// ============================================================
// チャート
// ============================================================

async function drawChart(
  data
) {

  const rows =
    data.data;


  const dates =
    rows.map(
      row =>
        row.date
    );


  const latestDate =
    data.endDate;


  const startObject =
    parseDate(
      latestDate
    );


  startObject
    .setFullYear(
      startObject
        .getFullYear() -
      1
    );


  let initialStart =
    dateString(
      startObject
    );


  if (
    initialStart <
    data.startDate
  ) {

    initialStart =
      data.startDate;
  }


  const initialRows =
    visibleRows(
      initialStart,
      latestDate
    );


  const profile =
    calculateVolumeProfile(
      initialRows
    );


  const maxProfile =
    Math.max(
      ...profile.totals,
      1
    );


  const dailyColors =
    rows.map(
      row =>
        row.close >= row.open
          ? BLUE
          : RED
    );


  const buyRows =
    rows.filter(
      row =>
        row.buyCandidate
    );


  const sellRows =
    rows.filter(
      row =>
        row.sellCandidate
    );


  // ==========================================================
  // Traces
  // ==========================================================

  const traces = [


    // ---------------------------------------------------------
    // 0 ローソク足
    // ---------------------------------------------------------

    {
      type:
        "candlestick",

      name:
        "株価",

      x:
        dates,

      open:
        rows.map(
          row => row.open
        ),

      high:
        rows.map(
          row => row.high
        ),

      low:
        rows.map(
          row => row.low
        ),

      close:
        rows.map(
          row => row.close
        ),

      xaxis:
        "x",

      yaxis:
        "y",

      increasing: {

        line: {
          color: BLUE
        },

        fillcolor:
          BLUE
      },

      decreasing: {

        line: {
          color: RED
        },

        fillcolor:
          RED
      }
    },


    // ---------------------------------------------------------
    // 1 5MA
    // ---------------------------------------------------------

    {
      type: "scatter",
      mode: "lines",
      name: "5MA",

      x: dates,

      y:
        rows.map(
          row => row.ma5
        ),

      xaxis: "x",
      yaxis: "y",

      line: {
        width: 1.4,
        color: "#f57c00"
      }
    },


    // ---------------------------------------------------------
    // 2 25MA
    // ---------------------------------------------------------

    {
      type: "scatter",
      mode: "lines",
      name: "25MA",

      x: dates,

      y:
        rows.map(
          row => row.ma25
        ),

      xaxis: "x",
      yaxis: "y",

      line: {
        width: 1.4,
        color: "#7b1fa2"
      }
    },


    // ---------------------------------------------------------
    // 3 50MA
    // ---------------------------------------------------------

    {
      type: "scatter",
      mode: "lines",
      name: "50MA",

      x: dates,

      y:
        rows.map(
          row => row.ma50
        ),

      xaxis: "x",
      yaxis: "y",

      line: {
        width: 1.4,
        color: "#388e3c"
      }
    },


    // ---------------------------------------------------------
    // 4 高値5MA
    // ---------------------------------------------------------

    {
      type: "scatter",
      mode: "lines",
      name: "高値5MA",

      x: dates,

      y:
        rows.map(
          row => row.highMa5
        ),

      xaxis: "x",
      yaxis: "y",

      line: {
        width: 1,
        dash: "dot",
        color: "#777"
      },

      visible:
        "legendonly"
    },


    // ---------------------------------------------------------
    // 5 安値5MA
    // ---------------------------------------------------------

    {
      type: "scatter",
      mode: "lines",
      name: "安値5MA",

      x: dates,

      y:
        rows.map(
          row => row.lowMa5
        ),

      xaxis: "x",
      yaxis: "y",

      line: {
        width: 1,
        dash: "dot",
        color: "#999"
      },

      visible:
        "legendonly"
    },


    // ---------------------------------------------------------
    // 6 52週高値
    // ---------------------------------------------------------

    {
      type: "scatter",

// ============================================================
// 銘柄ロード
// ============================================================

async function loadStock(
  code
) {

  code =
    code
      .trim()
      .toUpperCase();


  if (
    !/^[0-9A-Z]{4}$/
      .test(code)
  ) {

    throw new Error(
      "東証銘柄コードを4文字で入力してください"
    );
  }


  const status =
    document.getElementById(
      "status"
    );


  status
    .classList
    .remove(
      "error"
    );


  status.textContent =
    `${code} を読み込み中...`;


  const response =
    await fetch(
      `/api/stock/${code}`,
      {
        cache:
          "no-store"
      }
    );


  if (
    !response.ok
  ) {

    if (
      response.status ===
      404
    ) {

      throw new Error(
        `${code} のデータはR2に保存されていません`
      );
    }


    throw new Error(
      `HTTP ${response.status}`
    );
  }


  const data =
    await response.json();


  if (
    !Array.isArray(
      data.data
    ) ||
    !data.data.length
  ) {

    throw new Error(
      "株価データがありません"
    );
  }


  currentStock =
    data;

  currentCode =
    code;


  prepareIndicators(
    data.data
  );


  document
    .getElementById(
      "stockCode"
    )
    .value =
      code;


  document
    .getElementById(
      "stockTitle"
    )
    .textContent =
      `${code} ${data.name ?? ""}`;


  updateSummary(
    data
  );


  updateFavoriteButton();


  await drawChart(
    data
  );


  status.textContent =
    `表示データ：${data.startDate} ～ ${data.endDate} ／ ` +
    `${formatNumber(data.rowCount)}営業日 ／ ` +
    `最終取得 ${data.fetchedAt ?? "-"}`;
}


// ============================================================
// 期間変更
// ============================================================

async function setPeriod(
  period
) {

  if (
    !currentStock
  ) {
    return;
  }


  const end =
    parseDate(
      currentStock.endDate
    );


  let start =
    new Date(
      end
    );


  switch (
    period
  ) {

    case "3m":

      start.setMonth(
        start.getMonth() -
        3
      );

      break;


    case "6m":

      start.setMonth(
        start.getMonth() -
        6
      );

      break;


    case "1y":

      start.setFullYear(
        start.getFullYear() -
        1
      );

      break;


    case "3y":

      start.setFullYear(
        start.getFullYear() -
        3
      );

      break;


    case "5y":

      start.setFullYear(
        start.getFullYear() -
        5
      );

      break;


    case "10y":

      start.setFullYear(
        start.getFullYear() -
        10
      );

      break;


    case "all":

      start =
        parseDate(
          currentStock.startDate
        );

      break;
  }


  let startText =
    dateString(
      start
    );


  if (
    startText <
    currentStock.startDate
  ) {

    startText =
      currentStock.startDate;
  }


  const endText =
    currentStock.endDate;


  await Plotly.relayout(
    chart,
    {

      "xaxis.range": [
        startText,
        endText
      ],

      "xaxis3.range": [
        startText,
        endText
      ],

      "xaxis4.range": [
        startText,
        endText
      ]
    }
  );


  await updateVolumeProfile(
    startText,
    endText
  );
}
