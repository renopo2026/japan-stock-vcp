<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Japan Stock VCP</title>
  <script src="https://cdn.plot.ly/plotly-3.7.0.min.js" charset="utf-8"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f3f4f6;
      color: #202124;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .app { max-width: 1800px; margin: 0 auto; padding: 14px; }
    .header, .chart-card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    .header { padding: 15px 18px; margin-bottom: 10px; }
    .chart-card { padding: 5px; }
    .title-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 23px; }
    #stockTitle { margin-top: 6px; font-size: 18px; font-weight: 600; }
    .controls { margin-top: 13px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    input, select, button {
      padding: 7px 9px;
      border: 1px solid #bbb;
      border-radius: 5px;
      background: #fff;
      font-size: 14px;
    }
    #stockCode { width: 110px; font-size: 16px; }
    button { cursor: pointer; padding: 7px 12px; }
    button:hover { background: #f2f2f2; }
    button.active { color: #fff; background: #222; border-color: #222; }
    .period-buttons { display: flex; gap: 4px; flex-wrap: wrap; }
    .checkbox-control {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 9px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: #fafafa;
      cursor: pointer;
      user-select: none;
      font-size: 14px;
    }
    .checkbox-control input { margin: 0; width: 16px; height: 16px; cursor: pointer; }
    .status { margin-top: 9px; font-size: 13px; color: #666; }
    .error { color: #c62828; font-weight: 600; }
    .summary { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 15px; font-size: 13px; }
    .summary-label { color: #777; }
    .buy { color: #1565c0; font-weight: 700; }
    .sell { color: #c62828; font-weight: 700; }
    #chart { width: 100%; height: 1080px; }
    .info { padding: 3px 12px 8px; color: #666; font-size: 12px; }
    @media (max-width: 800px) { #chart { height: 900px; } }

<body>
<div class="app">
  <div class="header">
    <div class="title-row">
      <div>
        <h1>Japan Stock VCP</h1>
        <div id="stockTitle">読み込み中...</div>
      </div>
      <div>
        <button id="favoriteButton">☆ お気に入り</button>
        <button id="saveImage">PNG保存</button>
      </div>
    </div>

    <div class="controls">
      <input id="stockCode" value="9984" maxlength="4" placeholder="9984">
      <button id="loadButton">読み込む</button>
      <div class="period-buttons">
        <button data-period="3m">3M</button>
        <button data-period="6m">6M</button>
        <button data-period="1y" class="active">1Y</button>
        <button data-period="3y">3Y</button>
        <button data-period="5y">5Y</button>
        <button data-period="10y">10Y</button>
        <button data-period="all">ALL</button>
      </div>
      <label>価格帯
        <select id="profileBins">
          <option value="20">20</option>
          <option value="30">30</option>
          <option value="50" selected>50</option>
          <option value="75">75</option>
          <option value="100">100</option>
        </select>
      </label>
      <label class="checkbox-control">
        <input type="checkbox" id="showVolumePane">
        出来高ペイン
      </label>
    </div>

    <div id="status" class="status">読み込み中...</div>
    <div id="summary" class="summary"></div>
  </div>

  <div class="chart-card">
    <div id="chart"></div>
    <div id="profileInfo" class="info">価格帯別出来高を計算中...</div>
    <div id="vcpInfo" class="info">VCP：青棒＝N（26日上昇VCP合計 − 26日下落VCP合計）、オレンジ＝5MA、紫＝25MA、黒太線＝0。K/L/Mは非表示。</div>
    <div id="supplyInfo" class="info">需給データを確認中...</div>
  </div>
</div>

<script>
const BLUE = "#1976d2";
const RED = "#d32f2f";
const ORANGE = "#ef6c00";
const PURPLE = "#7b1fa2";
const GREEN = "#388e3c";
const BLACK = "#111111";
const GRAY = "#616161";

const chart = document.getElementById("chart");
let currentStock = null;
let currentSupply = null;
let currentSupplyDaily = [];
let currentCode = "9984";
let currentRangeStart = null;
let currentRangeEnd = null;
let updatingRange = false;
let showVolumePane = false;

// Trace indexes. Profile indexes must stay stable because restyle() uses them.
const PROFILE_UP_INDEX = 8;
const PROFILE_DOWN_INDEX = 9;

function isFiniteNumber(v) { return typeof v === "number" && Number.isFinite(v); }

function toNumber(v) {
  if (v === null || v === undefined || v === "") return null;
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
}

function formatNumber(v, digits = 0) {
  const n = toNumber(v);
  return n === null
    ? "-"
    : n.toLocaleString("ja-JP", { maximumFractionDigits: digits });
}

function parseDate(text) {
  return new Date(`${text}T00:00:00`);
}

function dateString(date) {
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;
}

function percentileInc(values, p) {
  if (!values.length || !values.every(isFiniteNumber)) return null;
  const sorted = [...values].sort((a,b) => a-b);
  if (sorted.length === 1) return sorted[0];

  const rank = p * (sorted.length - 1);
  const lower = Math.floor(rank);
  const upper = Math.ceil(rank);

  if (lower === upper) return sorted[lower];

  const w = rank - lower;
  return sorted[lower] * (1-w) + sorted[upper] * w;
}

function calculateSma(rows, key, period) {
  const result = new Array(rows.length).fill(null);

  for (let i = period - 1; i < rows.length; i++) {
    const values = rows.slice(i-period+1, i+1).map(r => r[key]);

    if (values.every(isFiniteNumber)) {
      result[i] = values.reduce((a,b) => a+b, 0) / period;
    }
  }

  return result;
}

function prepareIndicators(rows) {
  for (let i = 0; i < rows.length; i++) {
    if (i >= 251) {
      let maxHigh = -Infinity;

      for (let j = i-251; j <= i; j++) {
        maxHigh = Math.max(maxHigh, rows[j].high);
      }

      rows[i].high52 = maxHigh;
    } else {
      rows[i].high52 = null;
    }

    if (
      !isFiniteNumber(rows[i].vcp26Delta5) &&
      i >= 5 &&
      isFiniteNumber(rows[i].vcp26) &&
      isFiniteNumber(rows[i-5].vcp26)
    ) {
      rows[i].vcp26Delta5 = rows[i].vcp26 - rows[i-5].vcp26;
    }

    if (i >= 119) {
      const values = rows.slice(i-119, i+1).map(r => r.vcp26Delta5);
      rows[i].deltaP10 = percentileInc(values, .10);
      rows[i].deltaP90 = percentileInc(values, .90);
    } else {
      rows[i].deltaP10 = null;
      rows[i].deltaP90 = null;
    }

    const contraction =
      isFiniteNumber(rows[i].dailyVcp) &&
      isFiniteNumber(rows[i].dailyVcpP10) &&
      rows[i].dailyVcp <= rows[i].dailyVcpP10;

    rows[i].buyCandidate =
      contraction &&
      isFiniteNumber(rows[i].vcp26Delta5) &&
      isFiniteNumber(rows[i].deltaP90) &&
      rows[i].vcp26Delta5 >= rows[i].deltaP90;

    rows[i].sellCandidate =
      contraction &&
      isFiniteNumber(rows[i].vcp26Delta5) &&
      isFiniteNumber(rows[i].deltaP10) &&
      rows[i].vcp26Delta5 <= rows[i].deltaP10;
  }

  const ma5 = calculateSma(rows, "vcp26", 5);
  const ma25 = calculateSma(rows, "vcp26", 25);

  for (let i = 0; i < rows.length; i++) {
    rows[i].vcp26Ma5 = ma5[i];
    rows[i].vcp26Ma25 = ma25[i];
  }
}

// Volume-by-Price approximation:
// assign 100% of each day's volume to its close-price bin.
function calculateVolumeProfile(rows) {
  if (!rows.length) return null;

  const bins = Number(document.getElementById("profileBins").value) || 50;
  const minPrice = Math.min(...rows.map(r => r.low));
  const maxPrice = Math.max(...rows.map(r => r.high));

  if (!(maxPrice > minPrice)) return null;

  const step = (maxPrice-minPrice)/bins;
  const up = new Array(bins).fill(0);
  const down = new Array(bins).fill(0);

  for (const row of rows) {
    let index = Math.floor((row.close-minPrice)/step);

    if (index === bins) index = bins-1;

    index = Math.max(0, Math.min(bins-1, index));

    if (row.close >= row.open) {
      up[index] += row.volume;
    } else {
      down[index] += row.volume;
    }
  }

  const prices = Array.from(
    {length: bins},
    (_,i) => minPrice + (i+.5)*step
  );

  return {
    bins,
    prices,
    widths: prices.map(() => step*.90),
    up,
    down,
    totals: prices.map((_,i) => up[i]+down[i]),
    step
  };
}

function buildSupplyDaily(stockRows, supplyRows) {
  const source = [...(supplyRows || [])].sort(
    (a,b) => a.date.localeCompare(b.date)
  );

  const result = [];
  let sourceIndex = 0;

  let publicShortRatio = null;
  let publicShortInstitutions = [];
  let loanRatio = null;
  let loanBalance = null;
  let stockLoanBalance = null;
  let marginRatio = null;
  let marginBuy = null;
  let marginSell = null;

  for (const stockRow of stockRows) {
    while (
      sourceIndex < source.length &&
      source[sourceIndex].date <= stockRow.date
    ) {
      const row = source[sourceIndex];

      if (
        row.publicShortRatio !== undefined &&
        row.publicShortRatio !== null
      ) {
        publicShortRatio = toNumber(row.publicShortRatio);
        publicShortInstitutions =
          Array.isArray(row.publicShortInstitutions)
            ? row.publicShortInstitutions
            : [];
      }

      if (row.loanRatio !== undefined) {
        loanRatio = toNumber(row.loanRatio);
      }

      if (row.loanBalance !== undefined) {
        loanBalance = toNumber(row.loanBalance);
      }

      if (row.stockLoanBalance !== undefined) {
        stockLoanBalance = toNumber(row.stockLoanBalance);
      }

      if (row.marginRatio !== undefined) {
        marginRatio = toNumber(row.marginRatio);
      }

      if (row.marginBuy !== undefined) {
        marginBuy = toNumber(row.marginBuy);
      }

      if (row.marginSell !== undefined) {
        marginSell = toNumber(row.marginSell);
      }

      sourceIndex++;
    }

    result.push({
      date: stockRow.date,
      publicShortRatio,
      publicShortInstitutions,
      loanRatio,
      loanBalance,
      stockLoanBalance,
      marginRatio,
      marginBuy,
      marginSell
    });
  }

  return result;
}

function shortInstitutionText(institutions) {
  if (!Array.isArray(institutions) || !institutions.length) {
    return "公表対象機関なし";
  }

  return institutions.map(item => {
    const ratio = toNumber(item.ratio);

    return `${item.name ?? "Unknown"}${
      ratio !== null ? ` ${ratio.toFixed(2)}%` : ""
    }`;
  }).join("<br>");
}

function visibleStockRows(start, end) {
  return currentStock
    ? currentStock.data.filter(r => r.date >= start && r.date <= end)
    : [];
}

function visibleSupplyRows(start, end) {
  return currentSupplyDaily.filter(
    r => r.date >= start && r.date <= end
  );
}

function rangeIncludeZero(values, paddingRatio=.10) {
  const valid = values.filter(isFiniteNumber);

  if (!valid.length) return [-.01,.01];

  let min = Math.min(0,...valid);
  let max = Math.max(0,...valid);
  let span = max-min;

  if (span === 0) {
    span = Math.max(Math.abs(max), .01);
  }

  return [
    min-span*paddingRatio,
    max+span*paddingRatio
  ];
}

function positiveRange(values, fallback=1) {
  const valid = values.filter(isFiniteNumber);

  if (!valid.length) return [0,fallback];

  return [
    0,
    Math.max(Math.max(...valid)*1.15, fallback)
  ];
}

function positiveLogRange(
  values,
  fallbackMin=.1,
  fallbackMax=1
) {
  const valid = values.filter(
    value =>
      isFiniteNumber(value) &&
      value > 0
  );

  if (!valid.length) {
    return [
      Math.log10(fallbackMin),
      Math.log10(fallbackMax)
    ];
  }

  let min = Math.min(...valid);
  let max = Math.max(...valid);

  if (min === max) {
    min = Math.max(
      min/1.5,
      .000001
    );

    max *= 1.5;
  } else {
    min = Math.max(
      min*.85,
      .000001
    );

    max *= 1.15;
  }

  return [
    Math.log10(min),
    Math.log10(max)
  ];
}  
  
function getPaneLayout() {
  if (showVolumePane) {
    return {
      height: 1220,
      priceDomain: [.67,1],
      volumeDomain: [.54,.60],
      vcpDomain: [.31,.48],
      supplyDomain: [0,.24]
    };
  }

  return {
    height: 1080,
    priceDomain: [.59,1],
    volumeDomain: [.555,.556],
    vcpDomain: [.31,.51],
    supplyDomain: [0,.24]
  };
}

function getInitialDisplayRange() {
  if (currentRangeStart && currentRangeEnd) {
    return {
      start: currentRangeStart,
      end: currentRangeEnd
    };
  }

  const end = parseDate(currentStock.endDate);
  const start = new Date(end);

  start.setFullYear(start.getFullYear()-1);

  let startText = dateString(start);

  if (startText < currentStock.startDate) {
    startText = currentStock.startDate;
  }

  return {
    start: startText,
    end: currentStock.endDate
  };
}

function coverageLabel(item) {
  if (!item) return "未取得";

  const period =
    item.startDate || item.endDate
      ? `${item.startDate ?? "?"}〜${item.endDate ?? "?"}`
      : "期間不明";

  switch (item.status) {
    case "ok":
      return `${period}`;

    case "partial":
      return `一部取得 ${period}`;

    case "no_events_in_coverage":
      return `公表イベントなし（0とは断定しない） ${period}`;

    case "unknown":
      return `状態不明 ${period}`;

    case "error":
      return "取得失敗";

    default:
      return `${item.status ?? "不明"} ${period}`;
  }
}

async function updateVisibleRange(start, end) {
  if (updatingRange || !currentStock) return;

  const rows = visibleStockRows(start,end);

  if (!rows.length) return;

  const profile = calculateVolumeProfile(rows);

  if (!profile) return;

  const maxProfile = Math.max(...profile.totals,1);

  let priceLow = Math.min(...rows.map(r => r.low));
  let priceHigh = Math.max(...rows.map(r => r.high));

  const high52 = rows.map(r => r.high52).filter(isFiniteNumber);

  if (high52.length) {
    priceHigh = Math.max(priceHigh,...high52);
  }

  const pricePadding = Math.max(
    (priceHigh-priceLow)*.045,
    profile.step
  );

  const maxVolume = Math.max(...rows.map(r => r.volume),1);
  const nRange = rangeIncludeZero(rows.map(r => r.vcp26));

  const supplyRows = visibleSupplyRows(start,end);
  const shortRange = positiveLogRange(
    supplyRows.map(r => r.publicShortRatio),
    1
  );
  const loanRange = positiveRange(
    supplyRows.map(r => r.loanRatio),
    1
  );
  const marginRange = positiveRange(
    supplyRows.map(r => r.marginRatio),
    1
  );

  updatingRange = true;

  try {
    await Plotly.restyle(chart, {
      x:[profile.up],
      y:[profile.prices],
      width:[profile.widths],
      customdata:[profile.up]
    }, [PROFILE_UP_INDEX]);

    await Plotly.restyle(chart, {
      x:[profile.down],
      y:[profile.prices],
      width:[profile.widths],
      customdata:[profile.down]
    }, [PROFILE_DOWN_INDEX]);

    const relayout = {
      "xaxis2.range":[maxProfile*3.5,0],
      "yaxis.range":[
        priceLow-pricePadding,
        priceHigh+pricePadding
      ],
      "yaxis3.range":nRange,
      "yaxis4.range":shortRange,
      "yaxis5.range":loanRange,
      "yaxis6.range":marginRange
    };

    if (showVolumePane) {
      relayout["yaxis2.range"] = [0,maxVolume*1.10];
    }

    await Plotly.relayout(chart, relayout);

    currentRangeStart = start;
    currentRangeEnd = end;

    document.getElementById("profileInfo").textContent =
      `価格帯別出来高：${start} ～ ${end} ／ ` +
      `${rows.length}営業日 ／ ${profile.bins}価格帯 ／ ` +
      `終値方式 ／ 左＝下落（赤）、右＝上昇（青）`;
  } finally {
    updatingRange = false;
  }
}

function updateSummary() {
  if (!currentStock) return;

  const stockRows = currentStock.data;
  const latest = stockRows[stockRows.length-1];

  const latestSupply =
    currentSupplyDaily.length
      ? currentSupplyDaily[currentSupplyDaily.length-1]
      : null;

  const buyCount =
    stockRows.filter(r => r.buyCandidate).length;

  const sellCount =
    stockRows.filter(r => r.sellCandidate).length;

  let signal = "候補なし";
  let signalClass = "";

  if (latest.buyCandidate) {
    signal = "▲ 買い候補";
    signalClass = "buy";
  }

  if (latest.sellCandidate) {
    signal = "▼ 売り候補";
    signalClass = "sell";
  }

  document.getElementById("summary").innerHTML = `
    <div>
      <span class="summary-label">終値</span>
      <strong>${formatNumber(latest.close,2)}</strong>
    </div>
    <div>
      <span class="summary-label">52週高値</span>
      ${formatNumber(latest.high52,2)}
    </div>
    <div>
      <span class="summary-label">VCP N</span>
      <strong>${formatNumber(latest.vcp26,6)}</strong>
    </div>
    <div>
      <span class="summary-label">VCP 5MA</span>
      ${formatNumber(latest.vcp26Ma5,6)}
    </div>
    <div>
      <span class="summary-label">VCP 25MA</span>
      ${formatNumber(latest.vcp26Ma25,6)}
    </div>
    <div class="${signalClass}">
      ${signal}
    </div>
    <div>
      <span class="summary-label">公表空売り</span>
      ${
        latestSupply?.publicShortRatio === null ||
        latestSupply?.publicShortRatio === undefined
          ? "-"
          : `${formatNumber(latestSupply.publicShortRatio,2)}%`
      }
    </div>
    <div>
      <span class="summary-label">貸借倍率</span>
      ${
        latestSupply?.loanRatio === null ||
        latestSupply?.loanRatio === undefined
          ? "-"
          : `${formatNumber(latestSupply.loanRatio,2)}倍`
      }
    </div>
    <div>
      <span class="summary-label">信用倍率</span>
      ${
        latestSupply?.marginRatio === null ||
        latestSupply?.marginRatio === undefined
          ? "-"
          : `${formatNumber(latestSupply.marginRatio,2)}倍`
      }
    </div>
    <div>
      <span class="summary-label">買い候補</span>
      ${buyCount}
    </div>
    <div>
      <span class="summary-label">売り候補</span>
      ${sellCount}
    </div>`;
}

function getFavorites() {
  try {
    return JSON.parse(
      localStorage.getItem("stockFavorites") || "[]"
    );
  } catch {
    return [];
  }
}

function updateFavoriteButton() {
  document.getElementById("favoriteButton").textContent =
    getFavorites().includes(currentCode)
      ? "★ お気に入り"
      : "☆ お気に入り";
}

function toggleFavorite() {
  let favorites = getFavorites();

  favorites = favorites.includes(currentCode)
    ? favorites.filter(c => c !== currentCode)
    : [...favorites,currentCode];

  localStorage.setItem(
    "stockFavorites",
    JSON.stringify(favorites)
  );

  updateFavoriteButton();
}

function installHoverLine() {
  chart.on("plotly_hover", event => {
    const point = event?.points?.[0];

    if (!point || point.x === undefined) return;

    Plotly.relayout(chart, {
      "shapes[0].x0":point.x,
      "shapes[0].x1":point.x,
      "shapes[0].visible":true
    });
  });

  chart.on("plotly_unhover", () => {
    Plotly.relayout(chart, {
      "shapes[0].visible":false
    });
  });
}

async function drawChart() {
  if (!currentStock) return;

  const rows = currentStock.data;
  const dates = rows.map(r => r.date);

  const {
    start: initialStart,
    end: latestDate
  } = getInitialDisplayRange();

  const initialRows =
    visibleStockRows(initialStart,latestDate);

  const profile =
    calculateVolumeProfile(initialRows);

  const maxProfile =
    Math.max(...profile.totals,1);

  const dailyColors = rows.map(
    r => r.close >= r.open ? BLUE : RED
  );

  const buyRows =
    rows.filter(r => r.buyCandidate);

  const sellRows =
    rows.filter(r => r.sellCandidate);

  const supplyDates =
    currentSupplyDaily.map(r => r.date);

  const shortHover =
    currentSupplyDaily.map(
      r => shortInstitutionText(r.publicShortInstitutions)
    );

  const pane = getPaneLayout();

  chart.style.height = `${pane.height}px`;

  const traces = [
    {
      type:"candlestick",
      name:"株価",
      x:dates,
      open:rows.map(r=>r.open),
      high:rows.map(r=>r.high),
      low:rows.map(r=>r.low),
      close:rows.map(r=>r.close),
      xaxis:"x",
      yaxis:"y",
      increasing:{
        line:{color:BLUE},
        fillcolor:BLUE
      },
      decreasing:{
        line:{color:RED},
        fillcolor:RED
      },
      hoverinfo:"skip"
    },
    {
      type:"scatter",
      mode:"markers",
      name:"OHLC",
      x:dates,
      y:rows.map(r=>r.close),
      customdata:rows.map(
        r=>[r.open,r.high,r.low,r.close]
      ),
      xaxis:"x",
      yaxis:"y",
      showlegend:false,
      marker:{
        size:12,
        color:"rgba(0,0,0,0)"
      },
      hovertemplate:
        "日付 %{x|%Y-%m-%d}<br>" +

async function fetchSupply(code) {
  try {
    const response = await fetch(
      `/api/supply/${code}`,
      {cache:"no-store"}
    );

    if (response.status === 404) {
      return null;
    }

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    return response.json();
  } catch (error) {
    console.warn("Supply fetch failed:",error);
    return null;
  }
}

async function loadStock(code) {
  code = code.trim().toUpperCase();

  if (!/^[0-9A-Z]{4}$/.test(code)) {
    throw new Error("東証銘柄コードを4文字で入力してください");
  }

  const status = document.getElementById("status");

  status.classList.remove("error");
  status.textContent = `${code} の株価を読み込み中...`;

  currentRangeStart = null;
  currentRangeEnd = null;

  /*
   * 需給データの取得は開始するが、
   * 株価チャートの表示を待たせない。
   */
  const supplyPromise = fetchSupply(code);

  /*
   * 株価データを先に取得する。
   */
  const stockResponse = await fetch(
    `/api/stock/${code}`,
    {cache:"no-store"}
  );

  if (!stockResponse.ok) {
    if (stockResponse.status === 404) {
      throw new Error(
        `${code} の株価データはR2にありません`
      );
    }

    throw new Error(
      `株価API HTTP ${stockResponse.status}`
    );
  }

  const stockData = await stockResponse.json();

  if (
    !Array.isArray(stockData.data) ||
    !stockData.data.length
  ) {
    throw new Error("株価データがありません");
  }

  /*
   * まず株価データだけを設定する。
   */
  currentStock = stockData;
  currentSupply = null;
  currentCode = code;

  prepareIndicators(currentStock.data);

  /*
   * 需給データが届くまではnullでチャートを作る。
   */
  currentSupplyDaily = buildSupplyDaily(
    currentStock.data,
    []
  );

  document.getElementById("stockCode").value =
    code;

  document.getElementById("stockTitle").textContent =
    `${code} ${currentStock.name ?? ""}`;

  document.getElementById("supplyInfo").textContent =
    "需給データを読み込み中...";

  updateFavoriteButton();

  /*
   * 株価・移動平均・VCPを先に表示する。
   */
  await drawChart();

  updateSummary();

  status.textContent =
    `株価：${currentStock.startDate} ～ ` +
    `${currentStock.endDate} ／ ` +
    `${formatNumber(currentStock.rowCount)}営業日 ／ ` +
    `需給を読み込み中...`;

  /*
   * 需給データの応答を待つ。
   * この時点で株価チャートはすでに表示されている。
   */
  const supplyData = await supplyPromise;

  /*
   * 需給取得中に別銘柄へ変更された場合は、
   * 古い銘柄の需給データを反映しない。
   */
  if (currentCode !== code) {
    return;
  }

  currentSupply = supplyData;

  currentSupplyDaily = buildSupplyDaily(
    currentStock.data,
    Array.isArray(currentSupply?.rows)
      ? currentSupply.rows
      : []
  );

  if (currentSupply?.rows?.length) {
    const cov = currentSupply.coverage || {};

    document.getElementById("supplyInfo").textContent =
      `需給：` +
      `公表空売り［${coverageLabel(cov.publicShort)}］ ／ ` +
      `貸借倍率［${coverageLabel(cov.loanRatio)}］ ／ ` +
      `信用倍率［${coverageLabel(cov.marginRatio)}］ ／ ` +
      `最終更新 ${currentSupply.updatedAt ?? "-"}`;
  } else {
    document.getElementById("supplyInfo").textContent =
      "需給データはまだR2にありません。" +
      "株価・VCPは通常表示します。";
  }

  /*
   * 需給データを加えてチャートを再描画する。
   */
  await drawChart();

  updateSummary();

  status.textContent =
    `株価：${currentStock.startDate} ～ ` +
    `${currentStock.endDate} ／ ` +
    `${formatNumber(currentStock.rowCount)}営業日`;
}

async function setPeriod(period) {
  if (!currentStock) return;

  const end =
    parseDate(currentStock.endDate);

  let start =
    new Date(end);

  switch (period) {
    case "3m":
      start.setMonth(start.getMonth()-3);
      break;

    case "6m":
      start.setMonth(start.getMonth()-6);
      break;

    case "1y":
      start.setFullYear(start.getFullYear()-1);
      break;

    case "3y":
      start.setFullYear(start.getFullYear()-3);
      break;

    case "5y":
      start.setFullYear(start.getFullYear()-5);
      break;

    case "10y":
      start.setFullYear(start.getFullYear()-10);
      break;

    case "all":
      start = parseDate(currentStock.startDate);
      break;
  }

  let startText = dateString(start);

  if (startText < currentStock.startDate) {
    startText = currentStock.startDate;
  }

  const endText =
    currentStock.endDate;

  currentRangeStart = startText;
  currentRangeEnd = endText;

  await Plotly.relayout(
    chart,
    {"xaxis.range":[startText,endText]}
  );

  await updateVisibleRange(
    startText,
    endText
  );
}
